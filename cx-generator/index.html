<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CX 문장 생성기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* layout: 왼쪽에 조건 입력, 오른쪽에 버전 카드. 좁은 화면에서는 한 열로 쌓인다. */
:root {
  --bg: #f1f4f3;
  --surface: #ffffff;
  --ink: #16211f;
  --muted: #5b6a66;
  --line: #d3dbd8;
  --accent: #0b6b5c;
  --accent-ink: #ffffff;
  --accent-soft: #e0efeb;
  --warn: #9a4a06;
  --warn-soft: #fbeedd;
  --bad: #a8231c;
  --bad-soft: #fbe4e2;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101615;
    --surface: #19211f;
    --ink: #e5ecea;
    --muted: #98a7a3;
    --line: #2b3835;
    --accent: #56c7b1;
    --accent-ink: #06231e;
    --accent-soft: #17332e;
    --warn: #f0b36a;
    --warn-soft: #3a2a14;
    --bad: #f39a93;
    --bad-soft: #3d1b19;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101615;
  --surface: #19211f;
  --ink: #e5ecea;
  --muted: #98a7a3;
  --line: #2b3835;
  --accent: #56c7b1;
  --accent-ink: #06231e;
  --accent-soft: #17332e;
  --warn: #f0b36a;
  --warn-soft: #3a2a14;
  --bad: #f39a93;
  --bad-soft: #3d1b19;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.6;
}
.wrap {
  max-width: 1180px;
  margin: 0 auto;
  padding: 16px 16px 40px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
header p { margin: 0; color: var(--muted); font-size: 13px; }
.grid { display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.row { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; align-items: start; }
.row > .field[hidden] { display: none; }
.field[hidden] { display: none; }
.label { font-size: 12px; font-weight: 600; color: var(--muted); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg span {
  display: block;
  padding: 5px 10px;
  border: 1px solid var(--line);
  border-radius: 7px;
  font-size: 13px;
  background: var(--surface);
  color: var(--ink);
}
.seg input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 500; }
.seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
select, textarea {
  width: 100%;
  font: inherit;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 8px 10px;
}
textarea { min-height: 110px; resize: vertical; line-height: 1.55; }
select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg[hidden], .hint[hidden] { display: none; }
.sub { padding-left: 10px; border-left: 2px solid var(--line); }
.hint { font-size: 12px; color: var(--muted); margin: 0; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button {
  font: inherit;
  cursor: pointer;
  border-radius: 7px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  padding: 8px 14px;
}
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; padding: 9px 18px; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
.status { font-size: 13px; color: var(--muted); margin: 0; flex: 1 1 140px; }
.status.bad { color: var(--bad); }
.results { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.results-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 12px; }
.results-head h2 { margin: 0; font-size: 15px; font-weight: 600; }
.results-head p { margin: 0; font-size: 12px; color: var(--muted); }
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 4px solid var(--accent);
  border-radius: 10px;
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.card.has-warn { border-left-color: var(--warn); }
.card.has-bad { border-left-color: var(--bad); }
.card-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.card-top strong { font-size: 13px; font-weight: 600; }
.count { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.count.over { color: var(--bad); font-weight: 500; }
.card-body { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; max-width: 68ch; }
.card-foot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.copy { font-size: 13px; padding: 5px 12px; }
.sample-tag { font-size: 11px; font-weight: 600; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; margin-left: 8px; }
.check { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-top: 2px; cursor: pointer; }
.check input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
.seg .sublabel { width: 100%; font-size: 12px; color: var(--muted); }
.typeline { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
.typeline[hidden] { display: none; }
.typeline strong { font-weight: 600; }
.typeline .why { color: var(--muted); }
.typeline.bad { border-color: var(--warn); }
.raw { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { button, .seg span { transition: background-color .12s, border-color .12s; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>CX 문장 생성기</h1>
    <p>티머니GO · 고속버스 티머니 응대 문장을 팀 규칙에 맞춰 씁니다.</p>
  </header>

  <div class="grid">
    <form class="panel" id="form">
      <div class="seg" role="radiogroup" aria-label="모드">
        <label><input type="radio" name="mode" id="mode-review" value="review" checked><span>앱 리뷰 답변</span></label>
        <label><input type="radio" name="mode" id="mode-recommend" value="recommend"><span>문장 추천</span></label>
        <label><input type="radio" name="mode" id="mode-polish" value="polish"><span>문장 다듬기</span></label>
        <label><input type="radio" name="mode" id="mode-shorten" value="shorten"><span>350자 줄이기</span></label>
      </div>

      <div class="field">
        <label class="label" for="input" id="l-input">고객 리뷰</label>
        <textarea id="input" spellcheck="false">택시 불렀는데 30분째 안 잡혀요. 급할 때 쓰라고 만든 앱 아닌가요</textarea>
      </div>

      <div class="actions">
        <button type="submit" class="primary" id="go">문장 만들기</button>
        <button type="button" id="stop" hidden>중단</button>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </div>

      <div class="row">
        <div class="field">
          <span class="label" id="l-app">앱</span>
          <div class="seg" role="radiogroup" aria-labelledby="l-app">
            <label><input type="radio" name="app" id="app-go" value="go" checked><span>티머니GO</span></label>
            <label><input type="radio" name="app" id="app-express" value="express"><span>고속버스</span></label>
          </div>
        </div>
        <div class="field" id="f-store">
          <span class="label" id="l-store">스토어</span>
          <div class="seg" role="radiogroup" aria-labelledby="l-store">
            <label><input type="radio" name="store" id="store-android" value="android" checked><span>안드로이드</span></label>
            <label><input type="radio" name="store" id="store-ios" value="ios"><span>아이폰</span></label>
          </div>
        </div>
      </div>

      <div class="field" id="f-type" hidden>
        <label class="label" for="type">문장 유형</label>
        <select id="type">
          <option value="앱 리뷰 답글">앱 리뷰 답글</option>
          <option value="1:1 문의 답변">1:1 문의 답변</option>
          <option value="채팅 상담 템플릿">채팅 상담 템플릿</option>
          <option value="ARS 스크립트">ARS 스크립트</option>
          <option value="챗봇 안내">챗봇 안내</option>
        </select>
      </div>

      <div class="field" id="f-topic">
        <div class="row">
          <div class="field">
            <label class="label" for="ctype">유형</label>
            <select id="ctype"><option value="">자동 판정</option></select>
          </div>
          <div class="field" id="sub-error" hidden>
            <label class="label" for="guide">앱 오류 안내</label>
            <select id="guide">
              <option value="">규칙대로</option>
              <option value="재부팅 + 채팅상담">재부팅 + 채팅상담</option>
              <option value="오류 화면 문자 발송 + 1:1문의">문자 발송 + 1:1문의</option>
              <option value="오류 화면 메일 발송 + 1:1문의">메일 발송 + 1:1문의</option>
              <option value="안내 없이 담당 부서 건의">담당 부서 전달</option>
            </select>
          </div>
        </div>
        <div class="seg" id="sub-update" role="radiogroup" aria-label="업데이트 불만 답변 구성" hidden>
          <label><input type="radio" name="reply" value="전달만" checked><span>전달만</span></label>
          <label><input type="radio" name="reply" value="확인 안내만"><span>확인 안내만</span></label>
        </div>
        <p class="hint" id="topic-hint" hidden></p>
        <label class="check"><input type="checkbox" id="inquiry"><span>1:1문의 안내로 쓰기</span></label>
        <p class="hint">켜면 유형과 상관없이 "불편한 점은 1:1문의에 남겨주시면 확인해 안내하겠다"는 팀 문구로 답합니다.</p>
      </div>

      <div class="row">
        <div class="field" id="f-tone">
          <label class="label" for="tone">어조</label>
          <select id="tone">
            <option value="">지정 안 함</option>
            <option value="전문적">전문적</option>
            <option value="친근한">친근한</option>
            <option value="공감형" selected>공감형</option>
            <option value="간결한">간결한</option>
            <option value="진심 어린">진심 어린</option>
            <option value="격식체">격식체</option>
          </select>
        </div>
        <div class="field" id="f-count">
          <span class="label" id="l-count">버전 개수</span>
          <div class="seg" role="radiogroup" aria-labelledby="l-count">
            <label><input type="radio" name="count" id="count-3" value="3" checked><span>3개</span></label>
            <label><input type="radio" name="count" id="count-5" value="5"><span>5개</span></label>
          </div>
        </div>
      </div>
    </form>

    <section class="results" aria-label="결과">
      <div class="results-head">
        <h2 id="results-title">결과</h2>
        <p>자동 점검은 금지어, 경로 표기, 글자 수만 봅니다. 내용은 직접 확인하세요.</p>
      </div>
      <div class="typeline" id="typeline" hidden></div>
      <div id="cards" class="results"></div>
    </section>
  </div>
</div>

<script type="text/plain" id="rules">
# CX 문장 작성

티머니GO와 고속버스 티머니의 고객 응대 문장을 쓴다. 읽는 사람은 불편을 겪은 고객이고, 답변은 공개되거나 그대로 발송된다. 그래서 확인되지 않은 것을 인정하지 않고, 지키지 못할 약속을 하지 않으며, 사람이 쓴 것처럼 담백해야 한다.

## 1. 시작

1. 모드를 정한다.
   - 앱 리뷰 답변: 고객 리뷰를 받으면 6장에서 유형을 골라 5개 버전을 쓴다.
   - 문장 추천: 입력 내용에 맞는 문장 5개 이상(7장).
   - 문장 다듬기: 입력 문장의 뜻과 사실을 그대로 두고 다듬은 5개 버전(7장).
   - 350자 줄이기: 맥락을 유지한 350자 이내 3개 버전(8장).
2. 앱 리뷰 답변인데 앱(티머니GO / 고속버스 티머니)이나 스토어(아이폰 / 안드로이드)를 모르면 한 번에 묻는다.
3. 판단이 어려우면 선택지를 제시하며 질문한다.
4. 어조 지정이 있으면 따른다(전문적, 친근한, 공감형, 간결한, 진심 어린, 격식체). 칭찬 리뷰는 어조가 전문적이어도 감사로 시작하는 따뜻한 답변으로 쓴다.

출력은 "버전 1", "버전 2"처럼 번호만 붙이고 본문만 쓴다. 분석, 제목, 설명, 구분선을 붙이지 않는다. 버전 사이는 한 줄 띄운다. 글자 수 제한은 줄이기 모드에만 있다. 분량을 채우려고 문장을 늘리지 않는다.

## 2. 규칙이 부딪힐 때

고정 문장·경로·사실(5장) > 유형별 지침(6장) > 원칙(3장) > 버전 간 다양성.

9장의 마무리·양해 문장은 고정이 아니라 선택지다. [표현 배정]이 주어지면 각 버전에 배정된 문장을 쓴다.

다양성은 고정되지 않은 부분(도입, 연결, 마무리)에서만 만든다. 고정 문장은 글자 그대로 쓴다.

"기준"이라고 표시된 문장은 고정이 아니다. 뜻과 "반드시 넣을 것"을 지키고 어순과 표현을 버전마다 다르게 쓰며, 같은 문장을 두 버전에 그대로 쓰지 않는다. 바꿔 쓸 때 약속의 세기를 올리지 않고, 기준에 없는 정보나 4장의 금지 표현을 넣지 않는다.

문장 추천·다듬기의 도입은 7장이 3장 6)보다 앞선다.

## 3. 원칙 일곱 가지

### 1) 확정하지 않는다
고객이 말한 상황이나 결함을 회사가 사실로 인정하는 문장을 쓰지 않는다. 확인 전에는 그런 일이 있었는지 알 수 없다.
- 문제 상태를 서술하지 않는다: "앱이 무겁게 느껴지셨다면", "결제는 완료되었으나 승차권이 확인되지 않아", "~은 개선이 필요한 부분입니다", "의견 확인하였습니다".
- 추측하지 않는다: ~것으로 보입니다, ~것으로 생각됩니다, ~듯합니다, ~마음 이해합니다.
  - 예외: 사과·양해 문장에서 회사가 부족했음을 낮춰 말하는 추측은 공감 표현으로 보고 쓸 수 있다. 예: 만족스러운 서비스를 제공해 드리지 못한 것 같아 죄송합니다. 고객이 겪은 오류·증상을 추측하는 데에는 쓰지 않는다.
- 당위를 말하지 않는다: ~해야 하는 부분입니다, ~되어야 할 사항입니다.
- 공감은 고객이 겪은 경험으로 쓴다. 시점은 중립적으로(결제 후), 동사는 고객 경험으로(보이지 않아, 찾을 수 없어). 기준: "결제 후 승차권이 보이지 않아 많이 당황스러우셨겠습니다."
- 공감에 붙이는 원인은 광고, 연휴, 정책처럼 사실인 것만. 오류, 지연, 앱 결함을 원인으로 단정하지 않는다.
- 예외: 입력에 조치 완료나 확인된 사실이 있으면 가정형으로 바꾸지 말고 사실로 쓴다.

### 2) 탓하지 않는다
- 고객 행동을 원인으로 내세우지 않는다(고객님께서 ~하셔서, ~하셨기 때문입니다). 같은 사실을 일반 조건으로 쓴다: "주행 불가 구역에서는 기기 주행이 제한됩니다."
- 고객 주장을 반박하지 않는다(고장은 아닙니다, 기기에는 문제가 없습니다).
- 실수를 의심하지 않는다(다른 화면을 보고 계신 것은 아닌지). "이용 중인 앱이 티머니GO가 맞는지"처럼 중립적으로 묻는다.
- 공감·사과의 주어는 화면·기능으로 쓴다: "결제가 되지 않아"(O), "결제하지 못해"(X).
- 당부는 쿠션어와 부탁으로: "불편하시더라도 ~ 이용 부탁드리겠습니다." ~하시면 됩니다, ~이 적용됩니다 같은 통보는 쓰지 않는다.
- 다른 곳으로 안내할 때는 이유를 붙인다: "해당 앱의 고객센터로 문의해 주시면 보다 정확한 안내를 받으실 수 있습니다."

### 3) 되풀이하지 않는다
- 고객 말을 요약해 되받지 않는다: [요약]+다는 점/지적/의견/취지 + [반응] 구조 전부.
- 리뷰에 나온 기능명·증상을 나열하지 않는다("인식 거리와 데이터 사용 관련하여").
- 지적을 목적절로 되받지 않는다("핵심 기능이 흔들리지 않도록").
- 고객 글을 평가, 호평, 생각이라고 부르지 않는다. 의견 또는 내용이라고 쓴다.
- 욕설이나 거친 표현에 반응하지 않는다.
- 경험에 공감하는 것은 되풀이가 아니다: "원하시는 메뉴를 바로 찾기 어려워 답답하셨겠습니다."

### 4) 약속하지 않는다
- 쓰는 표현: 담당 부서에 전달하겠습니다 / 검토될 수 있도록 담당 부서에 전달하겠습니다 / 담당 부서로 전달해 보겠습니다 / 내용을 올려보겠습니다 / 개선에 반영될 수 있도록 노력하겠습니다.
- 쓰지 않는 표현: 건의해 보겠습니다, 개선을 건의, 검토를 건의, 즉시·바로 전달, 반드시 개선, "검토하겠습니다"로 끝나는 문장, 살펴보겠습니다, 고민하겠습니다, 점검하겠습니다, 모니터링하고 있습니다, 확인 중입니다, 조치하겠습니다, 내부 논의를 거치겠습니다.
- 조건부 개선도 쓰지 않는다: 개선이 가능한지 확인하겠습니다, 반영 여부를 검토하겠습니다.
- 부서명은 "담당 부서"로만 쓴다. 구체적 결과(속도 개선, 재발 방지)를 약속하지 않는다.
- 사실 목록에 없는 기능·결제수단의 추가 예정을 말하지 않는다.

### 5) 담백하게 쓴다
- 정중하되 저자세가 아니다. 회사와 고객이 대등한 위치에서 예의를 갖춘 수준.
- 강조어(진심으로, 깊이, 너그러이, 부디 등)는 사과 쪽 하나, 양해 쪽 하나까지. 같은 쪽에 겹쳐 쌓지 않는다.
- 무뚝뚝한 말투, 명령조, 행정 말투(지원 범위에 제한이 있어)도 쓰지 않는다.
- 번역투를 쓰지 않는다(~에 대해 안내드립니다, ~하는 부분에 있어).
- 한 답변 안에서 같은 구절을 연달아 쓰지 않는다. 이웃한 두 문장에 "의견", "노력", "감사" 같은 낱말이나 같은 문장 틀이 겹치면 한쪽 문장을 다르게 쓰거나 그 낱말을 뺀다. 고정 문장 안의 낱말은 그대로 두고 그 앞뒤 문장을 바꾼다. "이용", "서비스", "불편"처럼 바꿔 쓸 말이 없는 기본 낱말은 겹쳐도 된다.
- 고객이 앱을 쓰는 일은 항상 "이용"으로 쓴다. 겹침을 피하려고 "쓰다", "쓰실 수 있도록", "사용"으로 바꾸지 않는다.
- 시점·조건은 문장 맨 앞에: "결제 후 승차권이 보이지 않아". 요청과 회사 행동을 "~바라며"로 잇지 않는다: "결제일시를 남겨주시면 확인해 보겠습니다." 주어가 바뀌는 절을 세 개 이상 잇지 않는다.
- 입력이 반말이거나 방어적이어도(당연히, 어쩔 수 없지) 태도는 옮기지 않고 정보만 살려 공손한 양해 요청으로 바꾼다.

### 6) 공감·사과·양해의 짝을 맞춘다
- 도입은 공감 한 문장 또는 사과 한 문장, 둘 중 하나만. 앱 리뷰 답변의 모든 유형에 적용한다. 사과는 답변 전체에서 한 번. 문장 추천·다듬기의 도입은 이 규칙이 아니라 7장을 따른다.
- 앱 리뷰 답변은 버전끼리 도입을 섞는다. 3개 버전이면 공감 2개·사과 1개, 5개 버전이면 공감 3개·사과 2개로 쓰고, 어조가 공감형이어도 이 비율을 지킨다. 공감 버전은 리뷰의 구체적 경험에 맞추고, 사과 버전은 대상이 있는 사과(예: 앱 이용에 불편을 드려 죄송합니다)로 쓴다. 칭찬, 조치 완료, 취소 수수료, 결제수단, 고객센터 처리 불만, 주행 불가처럼 유형 지침이 도입을 정해 둔 유형은 유형 지침을 따른다. 공감 문장의 어미는 정해 두지 않는다. 리뷰 상황과 문장 흐름에 맞게 자연스럽게 쓰고, 버전끼리 같은 어미를 되풀이하지 않는다. 4장의 금지 표현(공감드립니다, 이해드립니다 등)과 3장 1)의 추측 금지(~마음 이해합니다)만 피한다.
- 감정은 상황에 맞게 고른다. 아래는 감정 낱말을 고르는 기준이다. 어미는 자연스럽게 쓴다.
  - 기다림, 소식 없음: 답답하셨겠습니다
  - 갑작스러운 오류: 당황스러우셨겠습니다
  - 고객이 직접 수고를 들인 일(재설치, 여러 번 재시도, 다시 입력, 다시 문의)이 리뷰에 적혀 있을 때만: 번거로우셨겠습니다
  - 같은 증상이 되풀이된다는 말(자꾸, 맨날, 계속)만 있을 때: 불편하셨겠습니다 (번거로우셨겠습니다를 쓰지 않는다)
  - 그 밖: 불편하셨겠습니다 (아쉬우셨겠습니다, 의아하셨겠습니다는 쓰지 않는다)
- 사과에는 대상이 있어야 한다(이용에, 상담 이용에, 기다리게 해드린 점). 결함 자체를 대상으로 삼지 않는다. 신경 쓰이셨을, 번거로우셨을, 기다리게 해드려는 입력에 그 상황이 있을 때만.
- 사과는 고객이 겪은 불편에, 양해는 회사 사정·정책에 붙인다. 양해 문장에는 무엇을 양해해 달라는지 대상을 넣는다.
- "이용에 참고 부탁드립니다"는 앞에 안내한 정보가 있을 때만.
- 고객에게 수고를 요청하는 문장에는 번거로우시겠지만 / 번거로우시더라도를 붙인다. 수고스러우시겠지만은 쓰지 않는다. "혹시"는 가능성을 묻는 문장에만.
- 회사 잘못이 있는 불만: (공감 또는 사과) → 양해 → 전달 안내 → 개선 의지. 양해나 전달로 끝내지 말고 의지 한 문장으로 마무리한다. 전달 문장과 다짐 문장은 각각 한 번.
- 회사 잘못이 아닌 외부 절차(카드사 환불 기간 등): 소요 주체와 사유, 기간을 안내하고 양해 한 문장으로 끝낸다. 사과와 개선 의지를 붙이지 않는다.
- 불가·거절 안내: 한두 문장, 양해 한 번. 전달·개선·보답 문장을 붙이지 않는다.
- 고객센터 응대 불만이 다른 불만과 함께 있으면 고객센터 이용에 대한 사과나 양해를 따로 넣는다.

### 7) 더하지 않는다
- 리뷰나 입력에 없는 기능·증상·상황·정보를 넣지 않는다. QR, 반납, 환불, 광고, 로그인 등은 그 내용이 실제로 있을 때만 다룬다.
- 리뷰가 모호하면 유형을 고르지 말고 사과 한 문장 뒤에 5장의 확인 어려움 문장과 뒤 문장으로 답한다.
- 쟁점이 여러 개면 각각 한 문장씩 답한다. 하나만 고르거나 뭉뚱그리지 않는다. 쟁점은 고객이 불만으로 삼거나 답을 바라는 내용만이다. 배경이나 사정으로 지나가듯 언급한 말(예: 대중교통 때문에 쓸 수밖에 없다)은 쟁점이 아니므로 답하지 않는다.
- 이미 제공되는 기능을 요청하면 전달하겠다고 하지 말고 이용 방법을 안내한다.
- 내부 용어(지표, 수치, KPI, 수동 처리)는 쓰지 않거나 고객이 이해하는 말로 바꾼다.
- 사용자가 준 예시와 기준 답변은 구조와 말투 참고용이다. 고정이라고 표시된 문장만 그대로 쓰고 나머지는 새로 쓴다.

## 4. 금지어와 횟수 제한

쓰지 않는다.
- 쾌적한(어떤 형태든). 편리하게, 원활하게로 바꾼다.
- 과장된 반성: 새기겠습니다, 뼈아프게, 무겁게 받아들입니다, 가볍게 넘기지 않겠습니다, 마음에 담아두겠습니다, 통감, 겸허히, 깊이 반성.
- 인위적 표현: 자주 이용해 주셔서, 자주 찾아 주시는, 애용, 함께해 주셔서, 사랑해 주셔서, 아껴 주셔서, 성원, 큰 힘, 힘이 됩니다, 보람, 감동, 행복, 기쁩니다, 영광, 뿌듯, 의미 있는 일, 언제나 곁에서, 든든한, 최고의 서비스, 즐거운 여정, 모든 순간, 매 순간, 목소리에 귀, 귀 기울, 헛되지, 하나하나, 발전하는 모습, 감사의 말씀, 마음을 전합니다, 챙기겠습니다, 챙겨 보겠습니다.
- 단어: 소중한(칭찬 리뷰의 "소중한 리뷰를 남겨주셔서 감사합니다"만 예외), 거슬리다, 자산, 금전.
- 서비스 환경, 이용 환경. "서비스"로 쓴다(네트워크 환경은 가능).
- 공감드립니다, 이해드립니다.
- 수고스러우시겠지만, 수고스러우시더라도(어떤 형태든).
- 의아하셨겠습니다(어떤 형태든).
- 불만 답변 마무리의 "앞으로도". "앞으로 더"로 쓴다.
- 말씀해 주신 내용과 같이, 말씀 주신 대로 같은 되짚는 도입구.

5개 버전 중 한 번까지만 쓴다.
- "서비스로 보답"이 들어간 문장
- "앞으로 더 편리하게 이용하실 수 있도록 노력하겠습니다"

### 1:1문의 안내 문구 (팀 문구)
이용 중 불편한 점은 1:1문의에 남겨주시면 확인해 안내하겠다는 안내다. 단순 불만 유형과, 사용자가 "1:1문의 안내로 쓰기"를 고른 답변에 쓴다.

> 서비스 이용 중 문의사항 및 건의사항은 앱 내 1:1문의(경로: 선택된 앱의 1:1문의 경로)를 이용해 주시기를 바랍니다. 1:1문의 시에는 내용을 상세히 적어주시면 보다 빠르게 정확한 답변이 가능합니다.

- 기준 문장이다. 반드시 넣을 것: 1:1문의(경로), 내용을 상세히 적어 달라는 부탁, 빠르고 정확한 답변. 뜻과 "반드시 넣을 것"을 지키고 표현은 버전마다 다르게 쓴다.
- 끝에 "감사합니다"를 붙이지 않는다. 리뷰에서 서비스가 드러나면 "서비스 이용 중"을 그 서비스에 맞춰 쓴다(예: 택시 이용 중).

### 확인 어려움 문장
리뷰만으로는 상황을 알 수 없어 내용을 더 받아야 할 때 쓴다. 거절로 읽히지 않고 해결하려는 태도가 보이도록, 바로 뒤에 무엇을 남겨주면 확인해 안내하겠다는 문장이 반드시 온다.

> 남겨주신 리뷰만으로는 [대상] 확인이 어려워 정확한 안내가 어렵습니다.

[대상]은 리뷰에 맞는 것 하나를 골라 그대로 쓴다.
- 오류를 말함: 오류 현상에 대해
- 불만만 있음: 불편 겪으신 상황에 대해
- 어떤 서비스인지 알 수 없음: 어떤 서비스에 관한 문의인지
- 고속·시외버스, 기차: 문의하신 승차권 정보에 대해
- 항공: 문의하신 항공권 정보에 대해
- 택시: 문의하신 택시 호출 내역에 대해
- 자전거·킥보드: 문의하신 기기 대여 내역에 대해
- 렌터카·여행: 문의하신 예약 내역에 대해
- 결제·환불: 문의하신 결제 내역에 대해
- 그 밖: 문의하신 내용에 대해

뒤 문장: 유형 지침에 안내가 따로 있으면 그 안내를 쓴다. 없으면 아래 틀을 쓴다.

> 번거로우시겠지만 [남길 내용]을 1:1문의(경로: 선택된 앱의 1:1문의 경로)에 남겨주시면 확인 후 안내해 드리겠습니다.

- [남길 내용]: 고속·시외버스, 기차, 항공은 결제일시, 출발일시, 노선 / 택시는 출발지와 도착지, 출발 시간과 도착 시간 / 자전거·킥보드는 대여·반납일시와 이용하신 기기 / 렌터카·여행과 그 밖의 서비스는 이용 일시와 상세 내용 / 서비스를 모르면 상세 내용.
- 확인 어려움 문장은 글자 그대로 쓴다. 버전 간 차이는 도입, 뒤 문장, 마무리에서 만든다.
- 리뷰 답변이 아니면 "남겨주신 내용만으로는"으로 쓴다.
- 유형 지침 없이 이 틀만으로 답할 때는 뒤에 전달 문장을 붙이지 않는다.
- 리뷰가 구체적이어서 바로 안내할 수 있는 유형(택시 배차, 취소 수수료, 결제수단, 지원 버전, 광고, 개선 요청, 칭찬 등)에는 쓰지 않는다. 고객센터 처리 불만에는 그 유형의 기준 문장을 쓴다.

## 6. 앱 리뷰 답변

공개 답글이다. 번호 목록이나 단계별 형식 없이 자연스러운 한 문단으로 쓴다. 유형을 먼저 판정하고 그 지침을 따른다.

**칭찬**
- 감사 한 문장 + 다짐 한 문장. 기준: "소중한 리뷰를 남겨주셔서 감사합니다. 앞으로도 고객님께서 더욱 편리하게 이용하실 수 있도록 세심하게 신경쓰겠습니다." 기준 문장을 그대로 쓰는 버전은 하나까지.
- 감사 문장은 아래 셋 중에서만 고르고, 버전끼리 섞는다. 다른 감사 표현(선택해 주셔서, 마음을 전해 주셔서, 좋은 말씀 등)을 만들지 않는다.
  - 리뷰를 남겨주셔서 감사합니다.
  - 소중한 리뷰를 남겨주셔서 감사합니다.
  - [앱 이름]을 이용해 주셔서 감사합니다.
- 다짐 문장은 "[앞으로도 / 앞으로 더] [편리하게 / 만족스럽게 / 원활하게] 이용하실 수 있도록 [노력하겠습니다 / 최선을 다하겠습니다]" 틀 안에서만 바꾼다. 기준 문장 말고는 "신경쓰겠습니다", "챙기겠습니다", "사용하실", "믿고 쓸 수 있는 앱", "지금처럼"처럼 틀에 없는 표현을 쓰지 않는다.
- 감사 문장은 종류가 셋뿐이므로 버전끼리 겹쳐도 된다. 버전 간 차이는 감사와 다짐의 조합에서 만든다.
- 불편, 문제, 오류 같은 부정어와 "개선해 나가겠습니다"처럼 지금이 부족하다는 전제를 쓰지 않는다. 운영 방침 설명도 쓰지 않는다.

**단순 불만** (증상 없이 별로, 불편, 최악)
- 공감 또는 사과 → 5장의 1:1문의 안내 문구 → 마무리(9장 일반). 5장의 확인 어려움 문장은 쓰지 않는다.
- 채팅상담, 기종·OS 확인, 재부팅, 데이터 재시도 안내를 쓰지 않는다.

**개선 요청** (기능 추가·변경)
- 담당 부서 전달이 중심. 마지막 두 문장은 9장 "의견 감사형"에서 버전마다 다른 것을 그대로 쓴다.
- 경로 안내, 칭찬용 인사, 고객 심정 추측, 대상 없는 양해를 쓰지 않는다.

**업데이트·개편 불만** (업데이트나 개편 자체에 대한 불만이 중심이고, 오류·증상은 예시로 나열된 리뷰. 예: 업데이트하지 마라, 예전이 낫다, 다 바꿔 놓았다)
- 한 가지 증상을 해결해 달라는 리뷰는 앱 오류 유형으로, 증상을 여럿 늘어놓으며 그 원인을 업데이트로 바뀐 점으로 탓하는 리뷰는 이 유형으로 판정한다. 새 기능보다 속도·안정성을 먼저 챙기라는 리뷰는 업데이트 자체에 대한 불만이 아니므로 앱 오류 유형으로 판정한다.
- 구성은 사용자가 지정한 것을 쓴다. 지정이 없으면 "전달만"으로 쓴다.
  - 전달만: 공감 또는 사과 → 전달 한 문장 → 마무리(9장 일반).
  - 확인 안내만: 공감 또는 사과 → 5장의 확인 어려움 문장(불편 겪으신 상황에 대해)과 뒤 문장 → 마무리(9장 일반). 전달 문장을 쓰지 않는다.
- 공감·사과는 업데이트 이후 앱 이용의 불편에 맞춘다(예: 업데이트 이후 앱 이용에 불편을 드려 죄송합니다 / 업데이트 이후 앱 이용이 이전과 달라 불편하셨겠습니다). 리뷰에 나열된 증상을 옮기지 않는다.
- 전달 기준: "업데이트 이후 불편을 겪으신 부분은 검토될 수 있도록 담당 부서에 전달하겠습니다." 뜻을 지키고 표현은 버전마다 다르게 쓴다.
- 재부팅, 데이터 재접속, 기종·OS 요청, 의견 감사, 업데이트 배경 설명, 이전 버전으로 되돌린다는 말을 쓰지 않는다. 확인 어려움 문장과 1:1문의 경로는 "확인 안내만"일 때만 쓴다. 전달 문장과 확인 어려움 문장을 한 답변에 함께 쓰지 않는다.

**오류 개선 요구** (증상 없이 "오류 좀 고쳐라")
- "불안정하다", "이상하다", "오류가 많다"처럼 막연한 말만 있고 어느 화면·기능에서 무엇이 안 되는지 구체적인 증상이 없으면 이 유형으로 판정한다. 멈춤, 튕김, 접속 불가, 느림처럼 구체적인 증상이 있으면 앱 오류 유형으로 판정한다.
- 공감 또는 사과 → 5장의 확인 어려움 문장(오류 현상에 대해) → 뒤 문장 → 다짐.
- 뒤 문장 기준: "번거로우시겠지만 이용 중 발생한 오류 상황을 1:1문의(경로)에 자세히 남겨주시면 확인 후 안내해 드리겠습니다." 반드시 넣을 것: 오류 상황, 1:1문의(경로), 확인 후 안내. 뜻과 "반드시 넣을 것"을 지키고 표현은 버전마다 다르게 쓴다.
- 의견 감사, "의견을 바탕으로", 담당 부서 전달, "반복되는 오류로" 같은 인정 표현을 쓰지 않는다.
- 공감은 앱 이용이 원활하지 않았던 경험에 "불편하셨겠습니다" 또는 "답답하셨겠습니다"로 쓴다. "예전과 달라진", "예전보다"처럼 앱이 바뀌었다고 사실로 받는 표현과 "당황스러우셨겠습니다"는 쓰지 않는다.

**앱 오류: 연결 실패 / 일반** (멈춤, 튕김, 느림, 접속 불가)
- 순서는 안내 방법에 따라 다르다.
  - 재부팅 + 채팅상담(기본): 공감 또는 사과 → 재부팅 안내 → 5장의 확인 어려움 문장(오류 현상에 대해) → 채팅상담 안내 → 마무리(9장 오류). 확인 어려움 문장을 재부팅 안내보다 앞에 두지 않는다.
  - 문자·메일 발송 + 1:1문의: 공감 또는 사과 → 5장의 확인 어려움 문장(오류 현상에 대해) → 발송·1:1문의 안내 → 마무리(9장 오류).
  - 안내 없이 담당 부서 건의: 공감 또는 사과 → 건의 문장 → 마무리(9장 오류). 확인 어려움 문장과 채팅상담 안내를 쓰지 않는다.
- 공감은 리뷰에 적힌 상황만. 고객이 이미 해 본 조치(재설치 등)가 있으면 공감에서 받는다.
- 안내 방법은 사용자가 지정한 것만 쓴다. 지정이 없으면 기본 안내: "불편하시겠지만 먼저 휴대폰 재부팅 후 [셀룰러/모바일] 데이터로 다시 접속하여 이용 부탁드립니다. 다만 남겨주신 리뷰만으로는 오류 현상에 대해 확인이 어려워 정확한 안내가 어렵습니다. 같은 증상이 계속되면 어떠한 원인으로 말씀하신 상황이 발생하였는지 확인 후 도움드릴 수 있도록, 번거로우시더라도 채팅상담(경로)에 기종과 OS 버전을 남겨주시길 부탁드립니다." 일반 오류에는 데이터 재접속 부분을 뺀다.
- 지정이 없고, 리뷰가 기기·네트워크 등 사용자 환경 탓을 하지 말라고 미리 말하면 기본 안내 대신 "안내 없이 담당 부서 건의"로 쓴다. 재부팅, 데이터 재접속, 기종·OS 요청은 환경 탓으로 읽히므로 쓰지 않는다.
- 지정 가능한 다른 안내: 오류 화면을 캡처해 문자 또는 메일로 보낸 뒤 1:1문의(경로)에 발송 일시를 남기는 방식
- 안내 없이 담당 부서 건의를 지정했을 때:
  - 건의 문장에 리뷰의 주제를 한 마디로 넣는다. 리뷰가 한 가지 증상을 말하면 그 증상의 주제를 쓰고, 여러 증상을 말하면 그중 하나만 고르지 말고 그 증상들을 함께 아우르는 말을 쓴다. 공감·사과도 같은 범위로 쓴다. 기준: "[주제]와 관련하여 말씀해 주신 사항은 담당 부서로 전달하여 개선이 검토될 수 있도록 하겠습니다." 뜻을 지키고 표현은 버전마다 다르게 쓴다. 증상을 나열하지 않는다.
  - 사과로 시작하는 버전도 리뷰의 상황을 받는다(예: 앱 접속 중 불편을 드려 죄송합니다). "앱 이용에 불편을 드려 죄송합니다"처럼 어느 리뷰에나 붙는 사과만으로 쓰지 않는다.
- 의견 감사, 결과 약속을 쓰지 않는다. 반납 오류에는 이 유형을 적용하지 않는다.

**앱 오류: 조치 완료** (입력에 조치 완료, 복구, 현재 정상이 있을 때)
- 사실 문장(고정, [현상]만 리뷰에 맞게) → 사과 한 문장 → 마무리.
- 고정: "리뷰를 남겨주신 시점에 [현상]이 원활하지 않은 현상이 확인되어 긴급 조치하였으며, 현재는 정상적으로 [앱 이름] 이용이 가능합니다."
- 사과 예: 앱 이용에 불편을 드려 대단히 죄송합니다.
- 재부팅, 경로 안내, 전달, 의견 감사, 양해를 쓰지 않는다. 담당자 메모는 옮기지 않는다.

**설치·업데이트 불가: 지원 버전 미만** (사용자가 이 원인을 지정했을 때만)
- 공감 또는 사과 → 지원 버전 안내 → 대상이 있는 양해 한 문장. 세 문장으로 끝낸다.
- 기준 답변(이 결로 쓴다): "업데이트가 되지 않아 이용에 불편을 드려 죄송합니다. 보안 강화를 위해 지원 대상 안드로이드 버전이 정해져 있어, 사용 중인 기기의 안드로이드 버전에 따라 앱 업데이트가 어려울 수 있습니다. 이용이 제한되는 점 양해해 주시면 감사하겠습니다."
- 버전 간 차이는 도입(공감 또는 사과), 양해 표현(9장), 어순에서만 만든다. 지원 버전 안내 문장은 기준 답변의 낱말을 쓴다: 보안 강화를 위해 / 지원 대상 안드로이드 버전이 정해져 있어 / 사용 중인 기기의 안드로이드 버전에 따라 / 어려울 수 있습니다. "업데이트가 지원되지 않아", "지원 버전 기준으로", "이에 못 미치는", "보안 강화 차원에서" 같은 새 표현을 만들지 않는다.
- 공감으로 시작할 때는 "업데이트가 되지 않아 불편하셨겠습니다" 결로 쓴다. 양해 문장의 대상은 "이용이 제한되는 점" 또는 "이전 버전에서는 이용이 어려운 점"으로 쓴다.
- 최소 지원 버전 숫자(티머니GO는 안드로이드 10 이상, 고속버스 티머니는 안드로이드 8.0 이상, 선택된 앱의 숫자만)는 3개 버전 중 1개, 5개 버전 중 2개에만 넣는다: "지원 대상 안드로이드 버전이 10 이상으로 정해져 있어". 나머지 버전에는 숫자를 쓰지 않는다. 스토어가 아이폰이면 숫자 없이 "지원 대상 iOS 버전"이라고 쓴다.
- 리뷰가 설치를 말하면 설치로, 업데이트를 말하면 업데이트로 쓴다. 공감과 양해의 대상도 그 상황에 맞춘다.
- 기기를 원인으로 단정하지 않고(기종이 오래되어) 일반 조건으로 쓴다. 리뷰에 나온 기종명을 되풀이하지 않는다.
- 캐시 삭제, 재부팅, 재설치, 경로 안내, 담당 부서 전달·건의, 개선 다짐을 쓰지 않는다.

**설치·업데이트 불가: 캐시 삭제 안내** (사용자가 이 원인을 지정했을 때만, 안드로이드)
- 공감 또는 사과 → 10장 공통의 캐시 삭제 후 재설치 안내(경로 그대로) → 계속되면 플레이스토어 문의 안내.
- 리뷰가 설치를 말하면 설치로, 업데이트를 말하면 업데이트로 쓴다.
- 지원 버전 안내, 담당 부서 전달·건의를 쓰지 않는다.

**택시 배차: 호출이 안 잡힘**
- 공감 또는 사과 → 배차 방식 안내 → 마무리.
- 배차 방식(뜻 고정, 표현만 변경): 강제 배차가 아니라 운행자가 호출을 수락해야 배차되는 방식(필수). 승차 위치에서 직선거리로 가까운 차량에 요청되며, 주변에 배차 가능한 택시가 없으면 호출이 원활하지 않을 수 있다. 참고나 양해를 부탁한다.
- 마무리 기준: "남겨주신 리뷰는 담당 부서로 전달하여 원활한 콜 배차가 이루어질 수 있도록 노력하겠습니다." 반드시 넣을 것: 담당 부서 전달, 원활한 콜 배차, 노력. 뜻과 "반드시 넣을 것"을 지키고 표현은 버전마다 다르게 쓴다.
- 경로 안내와 그 밖의 다짐을 쓰지 않는다.

**택시: 배차 후 기사 취소**
- 공감 또는 사과(배차된 택시가 취소되어 다시 기다린 상황에 맞게) → 1:1문의 안내 → 마무리. 배차 방식 설명은 쓰지 않는다.
- 1:1문의 안내 기준: "번거로우시겠지만 호출 이력을 확인한 뒤 해당 운행자에 대한 피드백 및 교육을 진행할 수 있도록 1:1문의(경로)로 문의 부탁드립니다." 반드시 넣을 것: 호출 이력 확인, 운행자 피드백 및 교육, 1:1문의(경로). 뜻과 "반드시 넣을 것"을 지키고 표현은 버전마다 다르게 쓴다.
- 마무리 기준: "같은 불편이 반복되지 않도록 남겨주신 리뷰는 담당 부서로 전달하여 배차 서비스 개선과 운행자 교육에 힘쓰겠습니다." 반드시 넣을 것: 담당 부서 전달, 배차 서비스 개선, 운행자 교육. 뜻과 "반드시 넣을 것"을 지키고 표현은 버전마다 다르게 쓴다.

**택시: 운행자 문제** (불친절, 안 옴, 돌아감)
- 공감 또는 사과 → 수락 방식 안내 → 위 1:1문의 안내 → 마무리.
- 마무리 기준: "남겨주신 리뷰는 담당 부서로 전달하여 운행자 교육에 힘쓰겠습니다." 반드시 넣을 것: 담당 부서 전달, 운행자 교육. 뜻과 "반드시 넣을 것"을 지키고 표현은 버전마다 다르게 쓴다.

**택시: 네비·경로 / 도착 예정 시간**
- 공감(예: 이동 시간이 길어져 답답하셨겠습니다 / 기사님 도착 예정 시간이 표시되지 않아 불편하셨겠습니다) 또는 사과(택시 이용에 불편을 드려 죄송합니다) → 전달 문장 → 마무리(9장 일반).
- 전달 기준(경로): "경로 안내와 관련하여 말씀해 주신 사항은 네비 운영사로 전달하여 개선이 검토될 수 있도록 하겠습니다." 반드시 넣을 것: 경로 안내, 네비 운영사 전달, 검토될 수 있도록. 뜻과 "반드시 넣을 것"을 지키고 표현은 버전마다 다르게 쓴다.
- 전달 기준(도착 시간): "도착 예정 시간 안내와 관련하여 말씀해 주신 사항은 네비 운영사로 전달하여 개선이 검토될 수 있도록 하겠습니다." 반드시 넣을 것: 도착 예정 시간 안내, 네비 운영사 전달, 검토될 수 있도록. 뜻과 "반드시 넣을 것"을 지키고 표현은 버전마다 다르게 쓴다.
- 사과 문장에 길안내, 네비게이션, 경로 안내라는 단어를 넣지 않는다. 대안 경로 안내, 경로 오류 단정, 양해, 의견 감사를 쓰지 않는다.

**광고 불만**
- 티머니GO에만 적용한다. 회사 광고 응대 지침을 따른다. 회사가 정한 필수 안내는 두 가지다: 광고 노출 자체에 대한 불만·문의에 담당 부서 전달·건의를 쓰지 않고 광고 운영 현황을 사실대로 안내한다 / 고속·시외버스 배차 조회 광고는 회원가입 후 로그인하면 보이지 않는다고 안내한다. 아래 기준 문장은 회사 참고 예시를 팀 기준(3장, 4장 금지어)에 맞춘 것이며 글자 그대로 쓰지 않는다. 3장 4)의 "담당 부서에 전달" 표현과 9장 마무리보다 이 지침이 앞선다.
- 리뷰가 광고를 불만이나 질문으로 삼으면 이 유형으로 판정한다. 광고와 함께 버튼 반응·로딩 지연·느린 속도나 화면 구성(자주 쓰는 메뉴가 작아짐, 기사·광고가 자리를 차지함)을 말해도 이 유형으로 판정한다.
- 모든 버전에서 쓰지 않는 것: 담당 부서 전달·검토·건의(광고에 대한 의견은 담당 부서에 전달하겠습니다, 검토될 수 있도록 하겠습니다 등), 광고를 줄이거나 없애겠다는 약속, 광고 정책 변경·일정 예고, 재부팅·데이터 재접속·채팅상담·1:1문의·기종·OS 요청 등 고객에게 무언가를 하라는 안내(나)의 로그인 권유만 예외). 광고 운영·관리, 성능 최적화 작업은 회사가 확인한 사실이므로 사실로 쓴다. 확인된 현재 운영 방식과 고객이 지금 할 수 있는 방법만 안내한다.
- 아래 상황 중 리뷰에 맞는 것으로 쓴다. 광고 외 쟁점(속도, 화면 구성)이 함께 있으면 광고 설명과 그 쟁점 안내를 서로 다른 문장으로 나눠 쓴다. 한 문장으로 뭉뚱그리지 않는다.
- 가) 광고 자체 불만·광고를 왜 넣었는지 질문(화면 이동 때 광고가 뜸, 교통 앱에 왜 광고가 있나 등)
  - 공감 또는 사과 → 광고 운영 설명 → 광고 관리 문장.
  - 광고 운영 설명 기준: "티머니GO는 안정적인 서비스 운영과 다양한 이동 편의 기능을 지속적으로 제공하기 위해 앱 내 일부 영역에서 광고를 운영하고 있습니다." 반드시 넣을 것: 안정적인 서비스 운영, 일부 영역에서 광고 운영. [앱 이름]은 선택된 앱으로 쓴다.
  - 광고 관리 문장 기준: "주요 기능 이용 흐름을 지나치게 방해하지 않도록 광고 배치와 형식을 지속적으로 관리하고 있으며, 앞으로 더 편리하게 이용하실 수 있도록 힘쓰겠습니다." 반드시 넣을 것: 광고 배치와 형식 관리, 편리한 이용을 위한 노력.
- 나) 고속·시외버스 배차 조회·예매 중 광고
  - 공감(예매·배차 조회 중 광고가 보여 불편하셨겠습니다) 또는 사과 → 비회원 안내 → 로그인 권유와 마무리.
  - 비회원 안내 기준: "고속·시외버스 배차 조회 시 표시되는 광고는 비회원으로 이용하실 때에만 노출되며, 티머니GO 회원가입 후 로그인하시면 광고 없이 배차 조회와 예매를 이용하실 수 있습니다." 반드시 넣을 것: 비회원일 때에만 표시, 회원가입 후 로그인하면 표시되지 않음. 모든 버전에 넣는다.
  - 로그인 권유·마무리 기준: "보다 편리한 이용을 위해 로그인 후 이용 부탁드립니다. 더 편리하게 예매하실 수 있도록 노력하겠습니다." (3장 5: 요청과 회사 행동을 "~바라며"로 잇지 않는다)
- 다) 광고 + 버튼 반응·로딩 지연·느린 속도
  - 공감 또는 사과 → 광고 운영 설명(가)의 기준을 짧게) → 광고에 대한 양해 → 성능 최적화 문장.
  - 양해 기준: "다만 이로 인해 이용이 불편하셨을 수 있는 점 양해 부탁드립니다."
  - 성능 최적화 기준: "화면 전환과 버튼 반응 속도와 관련하여, 앱 반응 속도는 편리한 이용과 직결되는 부분인 만큼 전반적인 반응 속도 향상을 위해 성능 최적화와 안정화 작업을 지속적으로 진행하고 있습니다." 반드시 넣을 것: 성능 최적화와 안정화를 지속적으로 진행. 오류·지연을 사실로 인정하는 표현(지연이 잦아, 반복되어)은 쓰지 않는다(3장 1).
- 라) 광고 + 화면 구성(자주 쓰는 메뉴가 작아짐, 기사·광고 등 부가 콘텐츠가 자리를 차지해 필요한 기능을 찾기 어려움)
  - 공감 또는 사과(리뷰가 말한 기능을 찾기 어려웠던 불편에 대해) → 광고·부가 콘텐츠 운영 설명 → 주요 메뉴 개선 문장.
  - 사과 기준: "마이 메뉴의 이용내역 등 자주 이용하시는 기능을 찾으시는 과정에서 불편을 드려 죄송합니다." 리뷰가 말한 기능 이름으로 바꿔 쓴다.
  - 운영 설명 기준: "티머니GO는 안정적인 서비스 운영과 다양한 콘텐츠 제공을 위해 일부 영역에서 광고와 부가 콘텐츠를 운영하고 있습니다."
  - 개선 기준: "다만 대중교통 이용내역과 같은 주요 기능은 쉽게 찾고 이용하실 수 있어야 하는 만큼, 주요 메뉴를 보다 직관적이고 편리하게 이용하실 수 있도록 가독성과 접근성 개선에 힘쓰겠습니다." 리뷰가 말한 기능으로 바꿔 쓴다.
- 기준 문장은 뜻과 "반드시 넣을 것"을 지키고 어순과 표현을 버전마다 다르게 쓴다. 9장 마무리를 따로 붙이지 않는다(위 마지막 문장이 마무리다).
- 리뷰에 구체적인 불편(광고를 잘못 누르게 됨, 특정 화면에서 뜸 등)이 있으면 공감으로 시작하는 버전의 첫 문장에 그 불편을 고객이 겪은 일로 넣는다. 기준: "조회 중 광고가 표시되어 의도치 않게 광고를 누르시게 되어 불편하셨겠습니다." 반드시 넣을 것: 의도치 않게 누름, 불편(어미는 자연스럽게). "불편을 겪으셨겠습니다"로 쓰지 않는다. 광고 배치나 앱의 잘못으로 단정하지 않는다.
- 사과로 시작하는 버전은 잘못 누른 일을 사과 대상으로 삼지 않는다. 고객 행동에 사과하는 꼴이 되기 때문이다. 기준: "조회 중 광고로 인해 이용에 불편을 드려 죄송합니다."
- 리뷰가 광고 빈도를 불만으로 삼으면 공감·사과 문장에 그 빈도를 고객이 겪은 일로 넣는다. 기준: "광고가 자주 보여 불편하셨겠습니다." 회사가 광고가 많거나 과하다고 인정하는 표현(광고가 많아, 과도한 광고, 반복적으로 노출)과 "자꾸"·"때마다"·"매번"은 쓰지 않는다.

**광고 불만(고속버스 티머니)**
- 고속버스 티머니 앱의 광고 불만이다. 회사 광고 응대 지침(티머니GO 광고 불만)은 이 앱에 적용하지 않는다.
- 공감(광고로 인해 많이 불편하셨겠습니다) 또는 사과 → 전달 문장 → 마무리(9장 일반, 버전마다 다른 것). 마무리에 "의견"을 다시 쓰지 않는다.
- 리뷰에 구체적인 불편(광고를 잘못 누르게 됨, 특정 화면에서 뜸 등)이 있으면 공감으로 시작하는 버전의 첫 문장에 그 불편을 고객이 겪은 일로 넣는다. 기준: "조회 중 광고가 표시되어 의도치 않게 광고를 누르시게 되어 불편하셨겠습니다." 반드시 넣을 것: 의도치 않게 누름, 불편(어미는 자연스럽게). 뜻과 "반드시 넣을 것"을 지키고 표현은 버전마다 다르게 쓴다. "불편을 겪으셨겠습니다"로 쓰지 않는다. 광고 배치나 앱의 잘못으로 단정하지 않는다.
- 사과로 시작하는 버전은 잘못 누른 일을 사과 대상으로 삼지 않는다. 고객 행동에 사과하는 꼴이 되기 때문이다. 기준: "조회 중 광고로 인해 이용에 불편을 드려 죄송합니다."
- 전달 문장은 아래에서 버전마다 다른 것을 고른다. 같은 문장을 두 버전에 쓰지 않는다. 약속의 세기는 이 범위를 넘지 않는다(전달, 검토될 수 있도록까지).
  - 광고와 관련하여 남겨주신 의견은 검토될 수 있도록 담당 부서에 전달하겠습니다.
  - 남겨주신 의견은 담당 부서에 전달하여 검토될 수 있도록 하겠습니다.
  - 말씀해 주신 내용은 검토될 수 있도록 담당 부서에 전달하겠습니다.
  - 광고에 대한 의견은 담당 부서에 전달하겠습니다.
  - 남겨주신 리뷰는 담당 부서에 전달하여 광고와 관련한 의견이 검토될 수 있도록 하겠습니다.
- 양해 문장, 광고를 왜 운영하는지 설명하는 문구(서비스 운영을 위해, 안정적인 서비스 제공을 위해 등)를 쓰지 않는다.

- 로그인 화면의 광고는 10장의 사실(외부 업체 광고)을 따른다.

**타인 명의 카드 등록·결제 불가**
- 공감 또는 사과 → 안전한 서비스 이용과 부정 사용 방지를 위해 본인 명의 카드만 등록·결제 가능하도록 정책이 변경된 점 안내 → 대상이 있는 양해 한 문장(예: 타인 명의 카드는 등록이 어려운 점 양해 부탁드립니다).
- 개선, 전달, 노력, 담당 부서를 쓰지 않는다.

**취소 수수료 불만**
- 세 문장으로 끝낸다. 기준: "이용에 불편을 드려 죄송합니다. 취소 수수료는 고속·시외버스 운송약관에 따라 취소가 완료된 시점에 따라 부과될 수 있습니다. 수수료가 발생할 수 있는 점 양해 부탁드립니다."
- 회사가 부과 주체가 아니라는 것은 전제일 뿐이다. "임의로 부과하지 않는다" 같은 해명을 쓰지 않는다.
- 환불 기간, 결제수단별 환불, 수수료율·금액, 경로, 정보 요청, 개선 다짐, 전달을 쓰지 않는다.

**결제수단 미지원·추가 요청**
- 사과(이용에 불편을 드려 죄송합니다) → 결제수단 안내 → 확대 노력 의지(버전마다 다르게).
- 안내(이름을 하나도 빼지 않는다): "티머니GO 앱은 신용/체크카드를 등록하여 카드 간편결제 또는 페이코, 토스페이, 네이버페이, KB Pay 수단으로 결제하시거나, 고속/시외버스 노선 중 제휴된 노선만 모바일 티머니-페이머니 수단으로 결제하실 수 있습니다."
- 고객이 요청한 결제수단 이름을 되풀이하지 않는다. 추가 예정·검토 중이라고 말하지 않는다. 경로, 환불, 수수료 안내를 쓰지 않는다.

**반납 오류**
- 재부팅, 앱 재실행, 데이터 재시도, 기종·OS 요청, 담당 부서 전달·검토·건의를 쓰지 않는다.
- 따릉이: 단말기가 부착되어 무선 통신으로 운영되므로 잠금 레버 체결 시 전파 방해나 통신·단말기 특성으로 반납이 아닌 임시 잠금 처리가 될 수 있다. 잠금 체결 후 반납 알림을 확인하고 이동하도록 안내한다. 대여·반납일시, 반납 대여소명, 실제 이용시간, 잠금 레버 체결 여부를 1:1문의 또는 채팅상담으로 남겨달라고 한다. 직접 반납 요청 버튼은 안내하지 않는다.
- 전기자전거·킥보드: 서비스 지역 밖에서는 반납이 원활하지 않거나 추가 요금이 발생할 수 있으니 반납 구역 확인 후 시도하도록 안내한다. 대여·반납일시, 실제 이용시간, 반납 장소, 표출된 오류 메시지를 1:1문의 또는 채팅상담으로 남겨달라고 한다.
- 챗봇을 통해 채팅 상담 연결이 가능하다는 점도 안내한다.
- 리뷰에 "반납"이 있어도 반납이 안 된 오류가 아니면 이 안내를 쓰지 않는다.

**QR 승차권 인식 불가·승차 거부** (고속·시외버스 QR 승차권이 차량 단말기에 찍히지 않음, QR이 안 된다며 승차를 거부당함, 앱에 QR이 뜨지 않음)
- 리뷰가 QR 승차권이 찍히지 않았거나 QR로 승차를 거부당한 일을 말하면 이 유형으로 판정한다. QR이 안 되는 승차권을 미리 표기해 달라는 요청이 함께 있어도 개선 요청 유형이 아니라 이 유형으로 판정한다.
- 공감 또는 사과 → (해당할 때) 현장 발권 안내 → 아래 1, 2, 3을 이 순서대로 모두. 셋 중 하나도 빼지 않는다.
- 현장 발권 안내: 리뷰가 앱에 QR이 뜨지 않았다고 하거나 QR이 안 되는 승차권을 미리 알려 달라고 하면, QR 승차권이 아닌 경우 현장에서 발권한 뒤 이용하라는 안내가 앱에 이미 있다고 안내한다. 이미 있는 안내이므로 담당 부서 전달·의견 감사를 쓰지 않는다(3장 7).
- 1 기준: "남겨주신 리뷰만으로는 탑승 당시 승차권이 검표되지 않았던 상황에 대해 정확한 확인이 어려운 점 양해 부탁드립니다." 반드시 넣을 것: 탑승 당시 검표되지 않은 상황, 정확한 확인이 어려움, 양해.
- 2 기준: "차량 내 단말기를 통한 승차권 검표가 정상적으로 이루어지지 않는 경우, [앱 이름] 앱 내에서 승무사원이 직접 수동 검표하는 방식으로 탑승하실 수 있습니다." 반드시 넣을 것: 단말기 검표가 안 될 때, 앱에서 승무사원이 수동 검표, 탑승 가능.
- 3 기준: "차량, 운행자 등 운영사항은 운수사에서 직접 관리하고 있어 당시 승무사원이 승차를 거부한 사유에 관해서는 확인이 어렵습니다. 많이 불편하시겠지만 해당 내용은 예매하신 운수사로 상담받아 보시길 권유해 드립니다." 반드시 넣을 것: 운영사항은 운수사가 직접 관리, 승차 거부 사유 확인이 어려움, 예매한 운수사로 상담 권유.
- 3이 마지막 문장이다. 9장 마무리, 담당 부서 전달, 5장의 확인 어려움 문장과 1:1문의·채팅상담 경로를 쓰지 않는다. 운수사나 승무사원의 잘못으로 단정하지 않는다.

**환불 / 승차권 시간변경 환불** (수수료 불만이면 취소 수수료 유형)
- 환불: 결제수단에 따라 방식과 기간이 다르다. 신용/체크카드와 간편결제는 영업일 기준 3~5일, 페이머니는 취소 즉시.
- 시간변경: 예매변경 시 변경된 승차권으로 다시 결제되고, 결제 완료 시 기존 승차권은 자동 취소된다. 카드는 기존 예매 일자와 변경 일자가 다르면 카드사 업무절차에 따라 영업일 기준 3~5일, 페이머니는 즉시.
- 결제일시, 출발일시, 노선을 1:1문의 또는 채팅상담으로 남겨달라고 안내한다.

**상담 연결 불만** (전화 연결 안 됨, 1:1문의로만 접수)
- 사과 또는 공감 → 고객센터 이용에 대한 양해 → 챗봇을 통해 채팅 상담 연결이 가능하다는 안내(필수) → 전달(검토될 수 있도록 담당 부서에 전달하겠습니다) → 마무리.
- 리뷰가 1:1문의로만 접수되는 점을 불만으로 말하면 1:1문의 경로를 다시 안내하지 않는다. 정보가 필요하면 채팅상담으로 남겨달라고 한다.

**고객센터 처리 불만** (문의해도 해결이 안 됨)
- 세 요소를 모두 넣는다. 기준: "안내받으신 과정이 기대에 미치지 못했던 점 사과드립니다. 다만 작성해 주신 내용만으로는 구체적인 접수 경위를 확인하기 어려워 정확한 안내에 한계가 있는 점 양해 부탁드립니다. 동일한 불편이 반복되지 않도록 개선에 힘쓰겠습니다."
- 어떤 경로도 안내하지 않는다. 다시 창구를 안내하면 되돌려 보내는 것으로 읽힌다. "번거로움"을 쓰지 않는다.

**주행 불가·서비스 지역** (고객 행동이 원인인 안내)
- 기준 틀: "기기 이용이 원활하지 않아 불편을 겪으셨다니 안타까운 마음입니다. 일부 기기 운영사 정책에 따라 주행 불가 구역으로 진입한 경우 기기 주행이 제한되어 이용이 어려울 수 있습니다. 각 기기 운영사의 서비스 지역 여부는 대여 전에 확인하고 이용하실 수 있습니다. 불편하시더라도 추후 이용하실 때 이 점을 유의하여 이용 부탁드리겠습니다."
- 구조: 공감 → 일반 조건 설명 → 확인 방법 → 쿠션어 + 당부. 실제 상황(반납 구역 밖 반납, 추가 요금 등)으로 바꿔 같은 구조로 쓴다.

**QR 카메라 화면이 하얗게 뜸**
- 재부팅은 안내할 수 있다. 데이터 환경 안내는 하지 않는다.
- QR 인식이 어려우면 기기 번호를 직접 입력해 대여하도록 안내한다. 반납 사진 촬영이 어려우면 1:1문의로 반납 요청을 남겨달라고 한다.

**욕설 포함**
- 욕설만 있으면: 차분한 사과 + 구체적인 불편 사항을 1:1문의로 남겨달라는 안내.
- 다른 불만이 함께 있으면: 그 불만의 안내를 우선하고 욕설은 짧은 사과로만 처리한다.

**기타**
- 리뷰가 말한 구체적 불편을 한 번 짚어 공감한다. 어느 리뷰에나 붙일 수 있는 문장만으로 쓰지 않는다.
- 고객이 이미 구체적으로 말한 내용을 1:1문의로 다시 남겨달라고 하지 않는다.
- 10장에 해당 주제의 안내 사실이 있으면 그 내용을 안내한다.

## 7. 문장 추천·다듬기

입력 내용이 본론이다.
- 도입을 공감이나 사과로 고정하지 않는다. 3장 6)의 도입 규칙은 추천·다듬기에 적용하지 않는다.
- 다듬기: 인사말 다음의 첫 문장은 원문의 첫 문장을 다듬은 것으로 쓴다. 원문의 문장을 빼거나 공감·사과 문장으로 바꾸지 않고, 원문에 없는 공감·사과 문장을 새로 넣지 않는다. 어조가 공감형이어도 같다. 어조는 낱말과 어미 선택에만 반영한다. 버전 간 차이는 어휘와 문장 연결에서 만든다.
- 다듬기는 원문의 뜻과 문장 순서를 지키되, 과장되거나 추상적인 표현은 담백한 표준 표현으로 바꾼다. 원문의 표현을 살리는 것보다 3장 5)와 4장이 앞선다. 예: 진심으로 죄송한 마음을 전합니다 → 죄송합니다 / 기대하셨던 만큼의 만족을 드리지 못해 → 만족스러운 경험을 제공해 드리지 못해 / 말씀을 마음에 새기고 → 의견을 참고하여 / 하나하나 세심하게 챙겨보겠습니다 → 부단히 노력하겠습니다. 고객의 글은 "말씀"보다 "의견"으로 쓴다.
- 추천: 입력에 고객이 겪은 불편이 적혀 있을 때만 공감 또는 사과 한 문장으로 시작한다. 없으면 유형별 형식의 인사 뒤에 바로 입력 내용을 안내한다.
- 입력에 담긴 안내(어디로 문의하는지, 어떤 절차인지, 무엇이 되고 안 되는지)는 모든 버전에 넣는다. 사과와 다짐만으로 대체하지 않는다. "담당 부서로 전달하겠다"로 바꾸지도 않는다.
- 입력에 없는 정보를 넣지 않는다. 환불 기간, 정보 요청, 경로 안내는 입력에 있을 때만. 6장과 10장은 입력이 그 내용을 다룰 때만 참고한다.
- 입력이 사과와 양해 요청이면 사과와 양해 요청으로 끝낸다.
- 입력에 공감과 사과가 함께 있으면 둘 다 살리되 나란히 붙이지 않는다. 공감은 도입에, 사과는 안내 문장에 붙여 한 번만.
- 입력에서 확인된 사실을 가정형으로 바꾸지 않는다. 반대로 고객이 겪었다는 상황을 회사가 확정해 쓰지도 않는다.
- 반말, 구어, 방어적 태도는 합니다체 표준어의 공손한 표현으로 바꾼다(옛날 버전 → 이전 버전).
- 결제수단 안내 입력이면 결제수단 이름과 조건을 하나도 빼거나 바꾸지 않는다.
- 택시 배차 불만 입력이면 6장의 마무리 기준 문장으로 끝낸다(1:1 문의 답변에서는 "남겨주신 리뷰는" 대신 "말씀해 주신 내용은").

유형별 형식
- 앱 리뷰 답글: 6장의 형식. 다듬기에서 원문에 인사말이 있으면 유지한다.
- 1:1 문의 답변: "안녕하세요, 고객님."으로 시작하고 "감사합니다."로 끝낸다. "리뷰"는 "문의"로 바꿔 쓴다. 필요하면 단계별 안내를 쓴다.
- 채팅 상담 템플릿: 인사 → 핵심 안내 → 추가 문의 유도. 변수는 {변수명}. 짧게.
- ARS 스크립트: 짧은 구어체. 인트로 → 메뉴 안내 → 마무리.
- 챗봇 안내: 짧은 대화체. 선택지는 [버튼명]. 다음 행동 유도로 마무리.
- 리뷰 답글이 아닌 유형에는 리뷰, 후기, 별점 같은 표현을 쓰지 않고, 원문의 줄바꿈과 문단 구분을 그대로 둔다.

## 8. 350자 줄이기

- 3개 버전, 모두 350자 이내. 출력 전에 글자 수를 센다.
- 원문의 맥락, 핵심 의미, 정보를 빠뜨리지 않는다. 경로와 고유명사의 내용은 유지한다.
- 중복 표현과 군더더기 수식어를 줄인다. 불필요한 특수문자는 뺀다.
- 띄어쓰기를 최소화하고, 경로 구간은 띄어쓰기를 없앤다.
- 원문의 줄바꿈과 문단 구분, 격식과 존댓말은 유지한다.
- 택시 배차 불만이면 수락 방식 안내와 마무리 기준 문장의 내용은 남긴다. 기사 취소는 마무리 기준 문장의 내용만.

## 9. 마무리 문장

버전마다 다른 것을 쓴다. [표현 배정]이 있으면 배정된 문장을 글자 그대로 쓰고, 목록에서 다른 것을 고르거나 새로 쓰지 않는다. 유형 지침이 마무리 기준 문장을 따로 정해 둔 유형(택시, 칭찬 등)은 그 지침을 따르고 배정을 쓰지 않는다.

일반
- 더욱 개선된 서비스를 제공할 수 있도록 최선을 다하겠습니다.
- 지금보다 만족스러운 서비스를 제공해 드릴 수 있도록 최선을 다하겠습니다.
- 앞으로 보다 나은 서비스를 제공할 수 있도록 지속적으로 노력하겠습니다.

오류

의견 감사형 (개선 요청의 마지막 두 문장, 그대로)

## 10. 안내 사실 (팀 템플릿에서 추린 내용, 7월 기준)

답변은 아래 사실과 모순되지 않게 쓴다. 아래 사실은 리뷰가 그 내용을 직접 묻거나 그 기능이 안 된다고 불만으로 삼을 때만 꺼낸다. 리뷰에 같은 단어가 나왔다는 이유만으로 안내하지 않는다. 말투는 3장을 따르고 여기서는 내용만 가져온다. 날짜나 버전이 붙은 항목은 바뀌었을 수 있으니 오래됐으면 사용자에게 확인한다.

### 공통
- 티머니GO 로그인: 카카오톡 로그인, 휴대폰 본인인증(SMS 또는 PASS), 카카오뱅크 인증, 토스 인증. 본인인증이 어려운 정보로는 가입할 수 없다.
- 로그인 후 "다른 기기에서 사용중입니다"가 뜨며 종료되면 휴면 해제가 필요할 수 있다. 채팅상담으로 안내한다.
- 로그아웃하거나 앱을 삭제하면 기기에 저장된 결제수단 정보가 삭제된다. 로그아웃하지 않으면 자동 로그인된다.
- 다국어를 지원하지 않는다. 비회원 상태의 메인 화면 상단 [For Global Uses]에서 고속·시외버스, 택시의 Global site로 연결된다.
- 마케팅 수신 설정: 앱>전체메뉴>앱설정(톱니바퀴 아이콘)>마케팅 정보 수신 동의에서 PUSH/SMS.
- 티머니GO와 고속버스 티머니는 모바일 티머니와 다른 앱이다. 교통카드 충전·잔액 조회, 대중교통 이용, NFC 기능, 기후동행카드 충전·권종 변경은 지원하지 않으며 티머니 고객센터로 안내한다.
- 티머니GO 대중교통 라운지의 기후동행카드 플러스에서 실물 기후동행카드 등록과 따릉이 이용권 불러오기는 할 수 있다. 백만드로우는 대중교통 라운지로 통합되었다.
- 안드로이드에서 설치·업데이트가 안 되면: 휴대폰 설정>애플리케이션>구글 플레이스토어>저장공간>캐시 삭제 후 재설치. 계속되면 플레이스토어 프로필>고객센터>문의하기.
- 1:1문의에는 사진을 첨부할 수 없다. 사진은 문자로 받는다. 1:1문의는 접수 순서대로 답변된다.
- 티머니GO는 최신 버전(2.7.3 기준)부터 내부 보안 프로그램이 작동해 별도 보안 앱이 필요 없다. 고속버스 티머니 안드로이드는 보안을 위해 V3 Mobile Plus가 필요하다.
- 전기자전거·킥보드는 대여 전에 앱에서 배터리 잔량과 주행 가능 거리를 확인할 수 있다.

### 결제
- 티머니GO 결제수단: 6장 결제수단 유형의 안내 문장.
- 고속버스 티머니 결제수단: 신용/체크카드 간편결제, 페이코, 토스페이, 네이버페이, 모바일 티머니-페이머니.
- 카드 등록: 티머니GO>마이>결제 수단 관리. 서비스 탭(고속/시외/항공/기차, 택시/자전거/킥보드/렌터카/여행)마다 따로 등록한다.
- 본인 명의 카드만 등록·결제할 수 있고 네이버페이·토스페이도 본인 명의 인증이 필요하다. 다른 사람 명의 카드로 결제해야 하면 명의자가 로그인해 예매한 뒤 승차권 선물하기를 이용한다.
- 토스페이·네이버페이는 해당 앱에 카드를 먼저 등록해야 하며 계좌·포인트로는 결제할 수 없다. 고속·시외버스 예매의 신용/체크카드 일반 결제는 카드 등록 없이 가능하다.
- 한도 초과, 비밀번호 오류 등은 카드사에서 받은 응답 메시지가 표출된 것이다. 카드사 확인을 권한다.
- 택시 미납 요금이 최소 결제 가능 금액보다 적으면 네이버페이 결제가 실패할 수 있다. 다른 수단을 안내한다.
- 무통장입금, 계좌이체, 삼성페이, 모바일 티머니 교통카드로는 결제할 수 없다.
- 페이머니: 최초 1회 모바일 티머니 연결이 필요하다. 잔액이 부족하면 연결된 충전 수단으로 부족분이 먼저 충전된 뒤 결제된다(최소 충전 5,000원). T마일리지는 페이머니로 충전된 뒤 결제된다.
- 제휴되지 않은 일부 노선에서는 티머니 결제, GO마일리지, 쿠폰을 쓸 수 없다.
- 쿠폰이 보이지 않으면 쿠폰명과 유효기간을 1:1문의로 남겨달라고 한다.

### 고속·시외버스
- 티머니GO는 제휴 노선만 조회·예매할 수 있다. 비제휴 노선은 출발지 터미널로 안내한다. 고속버스 티머니 앱은 고속버스 노선만 되고 시외버스는 티머니GO로 안내한다.
- 배차는 회사가 입력하지 않는다. 고속버스는 고속사가 매월 20일경 다음 달 노선을 입력하고, 시외버스는 보통 출발 14일 전부터 예매되며 터미널마다 다르다. 배차와 운행은 터미널과 운수사가 관리한다.
- 좌석을 선택한 채 이탈하면 좌석이 점유되어 선택할 수 없고 5분 뒤 다시 활성화된다.
- 일부 노선은 현장 종이 승차권 발행이 필요해 출발이 임박하면 구매가 제한된다.
- 좌석이나 시간만 따로 바꿀 수 없다. 변경이 안 되면 취소 후 새로 예매해야 하며 수수료가 생길 수 있다. 출발지가 다르면 시간변경 서비스로 바꿀 수 없다. 취소된 승차권은 되돌릴 수 없다.
- 환불: 예매일과 취소일이 다르거나 취소 수수료가 있으면 카드 취소는 카드사 절차에 따라 취소일 기준 영업일 3~5일 뒤 확인된다. 기간이 지나도 확인되지 않으면 카드사로 안내한다.
- GO마일리지로 결제한 승차권을 취소할 때 수수료는 사용한 GO마일리지에서 먼저 차감된다.
- 예매 내역(티머니GO): 하단 마이>이용내역>[고속 시외] 탭. 티머니GO에서 예매한 내역만 보인다.
- 예매 내역(고속버스 티머니): 첫 화면 [예매 확인 및 변경] 또는 [마이페이지]>[결제내역]. 회원과 비회원 정보는 따로 관리된다. 비회원은 비회원 예매 확인에서 카드 간편결제는 생년월일, 네이버페이는 간편결제 예매 확인 후 출발일자로 조회한다.
- 승차권: 모바일 승차권(QR)은 발권 없이 차량 단말기에 인식한다. 현장 발권 승차권은 예매 휴대폰 번호와 생년월일로 창구나 무인발매기에서 발행한다. 발권 방식은 배차와 차량에 따라 다르고 터미널·운수사 기준으로 정해진다.
- QR 승차권은 [승차권 저장]으로 이미지를 저장해 전달할 수 있다. 검표를 위해 화면 밝기를 최대로 한다.
- 즐겨찾기: 배차 조회 화면 좌측 상단 별표. 추가한 노선은 간편 예매로 예매한다.
- 소요 시간은 평균속도와 거리로 환산한 값이라 교통 상황에 따라 달라진다. 도착 시간 정보는 고속사에서 받는다. 운행 관련 문의는 운수사로 안내한다.
- 좌석 배치도는 버스 등급별 표준 배열(버스연합회 제공) 기준이며 실제 차량이나 당일 차량 변경에 따라 다를 수 있다.
- 앱의 터미널 주소와 실제 승하차 위치는 다를 수 있다. 터미널이나 운수사로 확인을 안내한다.
- 승차 거부, 연착·지연, 현장 판매는 운수사나 터미널 소관이다.
- 할인은 좌석 선택 시 표기된 권종만 적용된다. 그 밖의 할인은 출발지 터미널로 안내한다.
- 고속·시외버스 요금은 2026년 10월 1일부터 9% 인상되었고 터미널·운수사 정책에 따른 것이다.
- 아이폰에서 달력이 비정상으로 보이면: 설정>일반>언어 및 지역>지역: 대한민국, 설정>일반>날짜 및 시간>자동으로 설정 ON.
- 시외버스 결제 실패 화면에 "조회에 실패하였습니다"가 뜨면 배차의 등급이나 요금 정보가 일치하지 않는 경우일 수 있다. 출/도착지와 출발 일시를 남겨달라고 한다.
- 고속버스 티머니 계정: 아이디는 이메일 형식. 비밀번호는 영문·숫자·특수문자 포함 10~16자이며 반복·순차 문자 4개 이상은 쓸 수 없다. 아이디 찾기는 가입 휴대폰번호로 하며 일부가 마스킹된다. 임시 비밀번호는 가입 휴대폰번호로 발송된다.
- 고속버스 티머니 로그인 화면의 광고는 외부 업체 광고다. 해당 페이지에 안내된 업체로 문의하도록 한다.

### 자전거·킥보드
- 따릉이는 단말기가 부착되어 무선 통신으로 운영되므로 전파 방해나 통신 특성으로 대여가 원활하지 않을 수 있다. 대여 처리 중 약 10초간 화면을 켠 채 잠금장치 가까이에서 기다리고 블루투스 상태를 확인하도록 안내한다.
- 따릉이 이용권: 티머니GO 앱>공공자전거 또는 자전거/킥보드>우측 상단 三>따릉이 이용권 '미보유'. 보유 중인 이용권이 없을 때 구매할 수 있다.
- 따릉이 고장 신고: 자전거번호 입력, 고장 항목 체크, 신고 내용 작성을 모두 해야 신고하기 버튼이 활성화된다.
- 전기자전거·킥보드 고장 신고는 기기 운영사로 접수된다: 티머니GO 앱>전체메뉴>고객지원>킥보드/전기자전거 사고/고장 신고. 고장으로 인한 요금 환불은 1:1문의로 받는다. 배터리 정상 소모로 주행이 끝난 경우는 환불이 어렵다.
- 서비스 구역과 주차 요금은 기기 운영사 정책이다. 서비스 지역 밖에 반납하면 주차 요금이 부과될 수 있고, 지도의 흰색 영역에 주차하면 부과되지 않는다. 대여 시 [반납구역을 확인해 주세요!] 팝업으로 안내된다. GO패스권으로 대여해도 주차 요금은 따로 결제된다.
- 반납 시 기기 전체와 주변이 보이는 주차 사진 촬영이 필요하다.
- 쏘카일레클의 일부 가맹 권역은 쏘카일레클 앱에서만 이용할 수 있다.
- GO패스권은 여러 장 보유할 수 있다. 결제 수단 선택 화면 상단 [보유중인 GO패스권]에서 선택 후 [적용하기].

### 택시
- 예상 요금은 호출 당시 도로 상황으로 안내되고, 자동결제는 미터기 요금으로 결제된다.
- 자동결제를 선택하면 결제수단 확인을 위해 가승인이 되고, 도착 후 실제 요금 결제와 가승인 취소가 진행된다. 두 처리가 거의 동시에 일어나 일시적으로 잔액 부족으로 미납 처리될 수 있으며, 미납 요금을 결제하면 가승인은 취소된다.
- 운행자 불만을 1:1문의로 남기면 해당 기사를 다시 만나지 않도록 조치할 수 있다.
- 운행되지 않고 취소된 호출은 앱에서 차량 정보를 확인하기 어렵다.
- 예약택시는 기사가 수락해야 예약이 확정된다. 인원과 캐리어 수는 요청사항에 적고, 확정 후 변경은 1:1문의로 받는다. 예약택시의 모바일 티머니 결제는 준비 중이다.

하나라도 어기면 고쳐서 낸다.

// 규칙을 장(##)과 절(###)로 나눠 두고, 모드와 앱에 필요한 부분만 보낸다.
const SEC = (() => {
  const out = { intro: "" };
  RULES.split(/\n(?=## )/).forEach((part) => {
    const m = part.match(/^## (\d+)\./);
    if (m) out[m[1]] = part.trim();
    else out.intro = part.replace(/^# .*\n/, "").trim();
  });
  return out;
})();
const BIKE_BLOCK = /^\*\*(반납 오류|주행 불가|QR 카메라)/;
const TAXI_BLOCK = /^\*\*택시/;
// 광고 불만은 앱마다 블록이 다르다. 티머니GO는 회사 광고 응대 지침, 고속버스 티머니는 이전 규칙(담당 부서 전달).
const GO_AD_BLOCK = /^\*\*광고 불만\*\*/;
const EXPRESS_AD_BLOCK = /^\*\*광고 불만\(고속버스 티머니\)\*\*/;
function blockForApp(b, appKey) {
  if (appKey === "go") return !EXPRESS_AD_BLOCK.test(b);
  return !TAXI_BLOCK.test(b) && !BIKE_BLOCK.test(b) && !GO_AD_BLOCK.test(b);
}
const BLOCK_KEYS = [
  [/택시|배차|운행자|기사님|콜/, /^\*\*택시/],
  [/결제수단|페이/, /^\*\*결제수단/],
  [/명의/, /^\*\*타인 명의/],
  [/지원 버전|안드로이드 버전|OS 버전|설치|업데이트/, /^\*\*설치·업데이트 불가/],
  [/수수료/, /^\*\*취소 수수료/],
  [/환불/, /^\*\*환불/],
  [/광고/, /^\*\*광고/],
  [/반납/, /^\*\*반납 오류/],
  [/주행|서비스 지역|반납 구역/, /^\*\*주행 불가/]
];
function pathLines(body, appKey) {
  const drop = appKey === "go" ? /^- 고속버스 티머니/ : /^- 티머니GO /;
  return body.split("\n").filter((l) => !drop.test(l)).join("\n");
}
function subs(body) {
  return body.split(/\n(?=### )/);
}
function typeBlocks() {
  const parts = SEC["6"].split(/\n\n(?=\*\*)/);
  return { head: parts[0], blocks: parts.slice(1) };
}
// 6장 블록 하나 = 유형 하나. name은 굵은 제목, title은 괄호 설명까지 포함한 첫 줄.
function typeList(appKey) {
  return typeBlocks().blocks
    .filter((b) => blockForApp(b, appKey))
    .map((b) => {
      const first = b.split("\n")[0];
      return { name: first.match(/^\*\*(.+?)\*\*/)[1], title: first.replace(/\*\*/g, ""), block: b };
    });
}
// 사용자가 지정할 때만 쓰는 유형은 자동 판정 후보에서 뺀다.
const MANUAL_ONLY = /사용자가 이 원인을 지정했을 때만/;

// 유형별로 필요한 10장 절. 목록에 없는 유형은 공통만 보낸다.
function factSections(names) {
  const want = new Set();
  if (!names.length) return null;
  for (const n of names) {
    if (/^칭찬/.test(n)) continue;
    if (/^(기타|단순 불만|개선 요청)/.test(n)) return null;
    want.add("공통");
    if (/^택시/.test(n)) want.add("택시");
    if (/^(반납 오류|주행 불가|QR 카메라)/.test(n)) want.add("자전거");
    if (/^(결제수단|타인 명의|취소 수수료|환불)/.test(n)) { want.add("결제"); want.add("고속"); }
    if (/^(광고|상담 연결|고객센터|QR 승차권)/.test(n)) want.add("고속");
  }
  return want;
}
function buildFacts(appKey, names) {
  const parts = subs(SEC["10"]);
  const want = factSections(names);
  const kept = parts.filter((s, i) => {
    if (i === 0) return true;
    if (appKey !== "go" && /^### (자전거|택시)/.test(s)) return false;
    if (!want) return true;
    return Array.from(want).some((w) => s.startsWith("### " + w));
  });
  return kept.length > 1 ? kept.join("\n") : "";
}

// 앱 리뷰 답변: 판정된(또는 지정된) 유형의 지침만 보낸다. names가 null이면 판정 실패로 보고 전체를 보낸다.
function buildReviewRules(appKey, names) {
  const fixed = pathLines(SEC["5"], appKey);
  const base = [SEC.intro, SEC["2"], SEC["3"], SEC["4"], fixed];
  const t = typeBlocks();
  const list = typeList(appKey);
  let six;
  if (names === null) {
    six = t.head + "\n\n" + list.map((x) => x.block).join("\n\n");
  } else if (!names.length) {
    six = t.head.replace("유형을 먼저 판정하고 그 지침을 따른다.", "이 리뷰는 유형을 정하기 어려운 모호한 리뷰로 판정되었다. 3장 7)의 '모호하면' 처리대로 쓴다.");
  } else {
    const blocks = list.filter((x) => names.includes(x.name)).map((x) => x.block);
    six = t.head.replace("유형을 먼저 판정하고 그 지침을 따른다.", "이 리뷰의 유형은 판정되었다. 아래 유형 지침을 따른다.") + "\n\n" + blocks.join("\n\n");
  }
  const facts = buildFacts(appKey, names || []);
  return base.concat([six, SEC["9"]], facts ? [facts] : [], [SEC["11"]]).join("\n\n");
}

// 1단계: 유형만 판정한다. 블록 제목과 블록 안의 판정 기준 문장만 보낸다.

  lines.push("- 배경이나 사정으로 지나가듯 말한 내용은 쟁점이 아니다.");
  lines.push("- 유형은 하나만 고른다. 쟁점이 여럿이면 가장 큰 쟁점의 유형을 고른다. 나머지 쟁점은 답변 단계에서 한 문장씩 다룬다.");
  lines.push("- 어떤 서비스나 상황인지 알 수 없을 만큼 모호하면 0을 고른다.");
  lines.push("- 맞는 유형이 없으면 '기타'를 고른다.");
  hints.forEach((h) => lines.push(h));
  lines.push("");
  lines.push("[리뷰]");
  lines.push(text);
  lines.push("");
  lines.push('JSON 하나만 출력한다: {"type": 번호, "reason": "판정 이유 한 문장"}');
  return { prompt: lines.join("\n"), list: list };
}
async function classify(appKey, text, signal) {
  const c = buildClassifyPrompt(appKey, text);
  const out = await sample(c.prompt, { signal: signal, cache: false });
  const m = (out.text || "").match(/\{[\s\S]*\}/);
  if (!m) return null;
  let data;
  try { data = JSON.parse(m[0]); } catch (e) { return null; }
  // 유형 하나만 쓴다. 두 유형 지침을 섞으면 서로 부딪힌다(업데이트 불만 + 앱 오류 등).
  const n = Number(Array.isArray(data.types) ? data.types[0] : data.type);
  if (!Number.isInteger(n) || n < 0 || n > c.list.length) return null;
  const names = n > 0 ? [c.list[n - 1].name] : [];
  return { names: names, reason: typeof data.reason === "string" ? data.reason : "" };
}

function buildRules(mode, appKey, text) {
  const fixed = pathLines(SEC["5"], appKey);
  if (mode === "shorten") {
    const out = [SEC["8"], subs(fixed)[1]];
    if (appKey === "go" && /택시|배차/.test(text)) out.push(typeBlocks().blocks.filter((b) => TAXI_BLOCK.test(b)).join("\n\n"));
    return out.join("\n\n");
  }
  const base = [SEC.intro, SEC["2"], SEC["3"], SEC["4"], fixed];
  const t = typeBlocks();
  const related = t.blocks.filter((b) => {
    if (!blockForApp(b, appKey)) return false;
    return BLOCK_KEYS.some(([key, title]) => key.test(text) && title.test(b));
  });
  const out = base.concat([SEC["7"]]);
  if (related.length) out.push("## 입력과 관련된 유형 지침 (6장에서 발췌)\n\n" + related.join("\n\n"));
  return out.concat(mode === "polish" ? [SEC["11"]] : [SEC["9"], SEC["11"]]).join("\n\n");
}

// 티머니GO 광고 불만은 회사 광고 응대 지침상 1:1문의·채팅상담·재부팅을 안내하지 않으므로 체크박스를 적용하지 않는다.
const AD_TYPE = /^광고 불만$/;
function inquiryApplies(typing) {
  return $("inquiry").checked && !(typing && typing.names && typing.names.some((n) => AD_TYPE.test(n)));
}

// typing: 앱 리뷰 답변일 때 { names, manual }. names가 null이면 판정 실패.
function buildPrompt(text, typing) {
  const mode = val("mode");
  const app = PATHS[val("app")];
  const lines = [];
  lines.push("너는 아래 [규칙]에 따라 고객 응대 문장을 쓰는 담당자다.");
  lines.push("");
  lines.push("[규칙]");
  lines.push(mode === "review" ? buildReviewRules(val("app"), typing.names) : buildRules(mode, val("app"), text));
  lines.push("");
  lines.push("[작업 조건]");
  lines.push("- 모드: " + MODES[mode].label);
  lines.push("- 앱: " + app.name);
  if (mode === "review") {
    lines.push("- 스토어: " + (val("store") === "ios" ? "아이폰(앱스토어)" : "안드로이드(구글플레이)"));
    if (typing.names && typing.names.length) {
      lines.push("- 리뷰 유형(" + (typing.manual ? "사용자 지정" : "판정 완료") + "): " + typing.names.join(", ") + ". 다른 유형으로 다시 판정하지 않는다.");
      if ($("guide").value && typing.names.some((n) => ERROR_TYPE.test(n))) lines.push("- 앱 오류 안내 방법(사용자 지정): " + $("guide").value);
      if (typing.manual && typing.names.some((n) => UPDATE_TYPE.test(n))) lines.push("- 업데이트·개편 불만 구성: " + val("reply"));
    }
    if (inquiryApplies(typing)) {
      lines.push("- 답변 구성(사용자 지정, 유형 지침의 구성보다 앞선다): 공감 또는 사과 → 5장의 1:1문의 안내 문구 → 마무리(9장 일반). 유형 지침에 있는 안내(재부팅, 채팅상담, 확인 어려움 문장, 담당 부서 전달, 배차 방식 설명 등)와 유형별 마무리 기준 문장은 쓰지 않는다. 공감·사과의 대상과 금지 표현은 유형 지침을 따른다.");
    }
  }
  if (mode === "recommend" || mode === "polish") lines.push("- 문장 유형: " + $("type").value);
  if (mode !== "shorten" && $("tone").value) lines.push("- 어조: " + $("tone").value);
  lines.push("");
  if (mode === "review" || mode === "recommend") {
    const praise = mode === "review" && typing && typing.names && typing.names.some((x) => /^칭찬/.test(x));
    lines.push(praise && !inquiryApplies(typing) ? assignPraise(Number(val("count")), app.name) : assignPhrases(Number(val("count"))));
    lines.push("");
  }
  lines.push("[" + MODES[mode].input + "]");
  lines.push(text);
  lines.push("");
  lines.push("[지시]");
  const n = mode === "shorten" ? 3 : Number(val("count"));
  lines.push(MODES[mode].ask.replace("{n}", n));
  if (mode !== "shorten" && n !== 5) lines.push("규칙에 '5개 버전'이라고 적힌 곳은 모두 " + n + "개 버전으로 읽는다.");
  lines.push("조건이 모두 주어졌으니 되묻지 말고 바로 쓴다. 입력만으로 유형을 정하기 어려우면 규칙의 '모호하면' 처리대로 쓴다.");
  lines.push("출력은 '버전 1'처럼 번호만 적은 줄과 그 아래 본문만 쓴다. 굵은 글씨, 제목, 인용 기호, 설명을 쓰지 않는다.");
  return lines.join("\n");
}

function parseVersions(text) {
  const clean = text.replace(/\*\*/g, "");
  const parts = clean.split(/^\s*버전\s*\d+\s*[:.]?\s*$/m).map((s) => s.trim()).filter(Boolean);
  return parts;
}

// 9장의 선택지 목록을 읽어 둔다. 모델에게 고르게 하면 같은 문장으로 몰리므로 코드가 섞어서 버전마다 배정한다.
const PHRASES = (() => {
  const out = { groups: [], apology: [] };
  let cur = null;
  SEC["9"].split("\n").forEach((line) => {
    const t = line.trim();
    if (!t || t.startsWith("## ")) return;
    if (t.startsWith("양해 표현:")) { out.apology = t.replace("양해 표현:", "").replace(/\.$/, "").split("/").map((x) => x.trim()).filter(Boolean); cur = null; return; }
    if (t.startsWith("- ")) { if (cur) cur.items.push(t.slice(2).trim()); return; }
    if (/^(일반|오류|의견 감사형)/.test(t)) { cur = { name: t.replace(/\s*\(.*$/, ""), items: [] }; out.groups.push(cur); return; }
    cur = null;
  });
  return out;
})();
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function assignPhrases(n) {
  const picks = PHRASES.groups.map((g) => ({ name: g.name, items: shuffle(g.items) }));
  const apo = shuffle(PHRASES.apology);
  const lines = ["[표현 배정]", "이번 요청에서 버전별로 쓸 마무리·양해 표현이다. 그 버전의 유형이 해당 문장을 쓰는 경우에만 배정된 것을 글자 그대로 쓴다. 유형 지침에 마무리 기준 문장이 따로 있으면 그 지침이 앞선다. 양해 문장이 필요 없는 유형에는 양해 표현을 넣지 않는다."];
  for (let i = 0; i < n; i++) {
    const parts = picks.map((g) => "마무리(" + g.name + "): " + g.items[i % g.items.length]);
    if (apo.length) parts.push("양해: " + apo[i % apo.length]);
    lines.push("- 버전 " + (i + 1) + " → " + parts.join(" | "));
  }
  return lines.join("\n");
}
// 칭찬 유형은 감사 문장 3개와 다짐 틀 안에서만 쓰므로 모델에게 맡기면 매번 같은 조합이 나온다.
// 6장 칭찬 블록의 목록과 틀을 읽어 코드가 버전마다 다른 조합을 배정한다.
function assignPraise(n, appName) {
  const block = typeBlocks().blocks.find((b) => /^\*\*칭찬\*\*/.test(b)) || "";
  const thanks = block.split("\n").filter((l) => /^  - /.test(l)).map((l) => l.trim().slice(2).replace("[앱 이름]을", appName + "를"));
  const tpl = (block.match(/다짐 문장은 "([^"]+)"/) || [])[1] || "";
  let pledges = [""];
  tpl.split(/(\[[^\]]+\])/).forEach((part) => {
    const opts = /^\[/.test(part) ? part.slice(1, -1).split("/").map((x) => x.trim()) : [part];
    pledges = pledges.flatMap((p) => opts.map((o) => p + o));
  });
  pledges = shuffle(pledges.map((p) => p.trim() + "."));
  const th = shuffle(thanks);
  const lines = ["[칭찬 배정]", "이 리뷰는 칭찬 유형이다. 버전마다 아래 배정된 감사 문장과 다짐 문장을 글자 그대로 쓴다. 다른 문장을 고르거나 고치지 않는다."];
  for (let i = 0; i < n; i++) lines.push("- 버전 " + (i + 1) + " → 감사: " + th[i % th.length] + " | 다짐: " + pledges[i % pledges.length]);
  return lines.join("\n");
}
function lastSentence(body) {
  const s = body.trim().split(/(?<=[.!?])\s+/);
  return s[s.length - 1].replace(/\s+/g, "");
}

function checkVersion(body, all, mode, appKey) {
  const flags = [];
  BANNED.forEach((w) => {
    if (body.includes(w)) flags.push({ level: "bad", text: "금지어: " + w });
  });
  if (body.includes("소중한") && !body.includes("소중한 리뷰를 남겨주셔서")) flags.push({ level: "bad", text: "금지어: 소중한" });
  LIMITED.forEach((l) => {
    if (body.includes(l.text) && all.filter((v) => v.includes(l.text)).length > 1) flags.push({ level: "warn", text: l.label });
  });
  const squash = (s) => s.replace(/\s+/g, "");
  const p = PATHS[appKey];
  const b = squash(body);
  // 회사 광고 응대 지침(6장 광고 불만, 티머니GO만): 담당 부서 전달, 광고 축소·제거 약속, 재부팅·상담 안내를 쓰지 않는다.
  if (appKey === "go" && /광고/.test(body) && /담당 ?부서/.test(body)) flags.push({ level: "warn", text: "광고 답변에 담당 부서 전달" });
  if (/광고[^.]{0,15}(줄이|줄여|축소|없애|제거|최소화)/.test(body)) flags.push({ level: "bad", text: "광고 축소·제거 약속" });
  if (appKey === "go" && /광고/.test(body) && /재부팅|채팅상담|1:1 ?문의/.test(body)) flags.push({ level: "warn", text: "광고 답변에 재부팅·상담 안내" });
  if (/1:1문의\(/.test(body) && !b.includes(squash(p.inquiry))) flags.push({ level: "warn", text: "1:1문의 경로 표기 확인" });
  if (/채팅상담\(/.test(body) && !b.includes(squash(p.chat))) flags.push({ level: "warn", text: "채팅상담 경로 표기 확인" });
  const other = PATHS[appKey === "go" ? "express" : "go"];
  if (b.includes(squash(other.inquiry)) || b.includes(squash(other.chat))) flags.push({ level: "bad", text: "다른 앱의 경로가 들어 있음" });
  if (mode === "shorten" && body.length > 350) flags.push({ level: "bad", text: "350자 초과" });
  if (mode !== "shorten" && mode !== "polish" && all.length > 1) {
    const end = lastSentence(body);
    if (all.filter((v) => lastSentence(v) === end).length > 1) flags.push({ level: "warn", text: "다른 버전과 마무리가 같음" });
  }
  return flags;
}

function renderCards(versions, opts) {
  const box = $("cards");
  box.textContent = "";
  versions.forEach((body, i) => {
    const flags = checkVersion(body, versions, opts.mode, opts.app);
    const card = document.createElement("article");
    card.className = "card" + (flags.some((f) => f.level === "bad") ? " has-bad" : flags.length ? " has-warn" : "");

    const top = document.createElement("div");
    top.className = "card-top";
    const name = document.createElement("strong");
    name.textContent = "버전 " + (i + 1);
    if (opts.sample) {
      const tag = document.createElement("span");
      tag.className = "sample-tag";
      tag.textContent = "예시";
      name.appendChild(tag);
    }
    const count = document.createElement("span");
    count.className = "count" + (opts.mode === "shorten" && body.length > 350 ? " over" : "");
    count.textContent = body.length + "자";
    top.append(name, count);

    const p = document.createElement("p");
    p.className = "card-body";
    p.textContent = body;

    const foot = document.createElement("div");
    foot.className = "card-foot";
    const chips = document.createElement("div");
    chips.className = "chips";
    if (!flags.length) {
      const c = document.createElement("span");
      c.className = "chip";
      c.textContent = "자동 점검 통과";
      chips.appendChild(c);
    }
    flags.forEach((f) => {
      const c = document.createElement("span");
      c.className = "chip " + f.level;
      c.textContent = f.text;
      chips.appendChild(c);
    });
    const copy = document.createElement("button");
    copy.type = "button";
    copy.className = "copy";
    copy.textContent = "복사";
    copy.addEventListener("click", () => {
      const done = () => { copy.textContent = "복사됨"; setTimeout(() => { copy.textContent = "복사"; }, 1400); };
      try {
        navigator.clipboard.writeText(body).then(done, () => selectText(p));
      } catch (e) { selectText(p); }
    });
    foot.append(chips, copy);
    card.append(top, p, foot);
    box.appendChild(card);
  });
}

function selectText(node) {
  const range = document.createRange();
  range.selectNodeContents(node);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  setStatus("자동 복사가 막혀 본문을 선택해 두었습니다. Ctrl+C로 복사하세요.", false);
}

function renderRaw(text) {
  const box = $("cards");
  box.textContent = "";
  const card = document.createElement("article");
  card.className = "card";
  const pre = document.createElement("p");
  pre.className = "raw";
  pre.textContent = text;
  card.appendChild(pre);
  box.appendChild(card);
}

function showType(typing) {

  box.className = "typeline";

    label.textContent = "지정 유형: " + typing.names[0];

  } else if (typing.names === null) {

  } else {
    label.textContent = "판정 유형: " + (typing.names.length ? typing.names[0] : "모호함 (확인 요청으로 답변)");
    why.textContent = (typing.reason ? typing.reason + " " : "") + "틀렸으면 왼쪽 '유형'에서 바꾸고 다시 만드세요.";

function setStatus(text, bad) {
  $("status").textContent = text;
  $("status").className = "status" + (bad ? " bad" : "");
}

function setBusy(busy) {
  $("go").disabled = busy || !sample;
  $("stop").hidden = !busy;
}

async function run(e) {
  e.preventDefault();
  const text = $("input").value.trim();
  if (!text) { setStatus("내용을 입력해 주세요.", true); $("input").focus(); return; }
  if (!sample) { setStatus("이 화면에서는 문장을 만들 수 없습니다. 아티팩트를 직접 열어 주세요.", true); return; }
  remember();
  const mode = val("mode");
  const app = val("app");
  controller = new AbortController();
  setBusy(true);
  $("results-title").textContent = MODES[mode].label + " 결과";
  $("typeline").hidden = true;
  // 한 열 배치(좁은 화면)에서는 결과가 폼 아래에 있으므로 결과 쪽으로 옮긴다.
  if (matchMedia("(max-width: 860px)").matches) $("results-title").scrollIntoView({ block: "start" });
  try {
    let typing = null;
    if (mode === "review") {
      const chosen = $("ctype").value;
      if (chosen) {
        typing = { names: [chosen], manual: true };
        showType(typing);
      } else {
        setStatus("유형을 판정하고 있습니다…", false);
        renderRaw("유형을 판정하고 있습니다…");
        const r = await classify(app, text, controller.signal);
        typing = r ? { names: r.names, reason: r.reason, manual: false } : { names: null, manual: false };
        showType(typing);
      }
    }
    setStatus("작성 중입니다…", false);
    renderRaw("작성 중입니다…");
    const out = await sample(buildPrompt(text, typing), {
      signal: controller.signal,
      cache: false,
      onText: ({ text: t }) => { if (t) renderRaw(t); }
    });
    const versions = parseVersions(out.text || "");
    if (versions.length) {
      renderCards(versions, { mode: mode, app: app, sample: false });
      setStatus(out.truncated ? "답변이 중간에 끊겼습니다. 다시 만들어 보세요." : versions.length + "개 버전을 만들었습니다.", !!out.truncated);
    } else {
      renderRaw(out.text || "");
      setStatus("버전을 나누지 못해 원문 그대로 표시했습니다.", true);
    }
  } catch (err) {
    if (controller.signal.aborted) {
      setStatus("중단했습니다.", false);
    } else if (err && err.code === "not_granted") {
      setStatus("Claude 사용이 허용되지 않아 문장을 만들 수 없습니다.", true);
    } else if (err && err.code === "rate_limited") {
      setStatus("요청이 많습니다. 잠시 뒤에 다시 눌러 주세요.", true);
    } else {
      setStatus("문장을 만들지 못했습니다. 다시 눌러 주세요." + (err && err.message ? " (" + err.message + ")" : ""), true);
    }
    if (err && err.text) renderRaw(err.text);
  } finally {
    setBusy(false);
    controller = null;
  }
}

restore();
syncFields();
document.querySelectorAll('input[name="mode"]').forEach((el) => el.addEventListener("change", syncFields));
document.querySelectorAll('input[name="app"]').forEach((el) => el.addEventListener("change", fillTypes));
$("ctype").addEventListener("change", syncTopic);
fillTypes();
$("form").addEventListener("submit", run);
$("stop").addEventListener("click", () => { if (controller) controller.abort(); });
renderCards(SAMPLE, { mode: "review", app: "go", sample: true });
$("go").disabled = true;
setStatus("준비 중입니다…", false);

(async () => {
  try {
    sample = window.claude ? await window.claude.use("sample") : null;
  } catch (e) { sample = null; }
  if (sample) {
    $("go").disabled = false;
    setStatus("오른쪽은 예시입니다. 내용을 넣고 버튼을 누르세요. 처음 한 번은 사용 동의를 묻습니다.", false);
  } else {
    setStatus("이 화면에서는 문장을 만들 수 없습니다. 아티팩트를 직접 열어 주세요.", true);
  }
})();
</script>
</body>
</html>
